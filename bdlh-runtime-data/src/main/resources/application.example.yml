# BDLH Agent Runtime 配置模板（可安全上传 git）
# 复制为 application-dev.yml 或 application-prod.yml 并填入真实密钥。
# 注意：application-dev.yml / application-prod.yml 已加入 .gitignore，不会被上传。

server:
  address: 0.0.0.0
  port: 8080

spring:
  flyway:
    enabled: ${BDLH_FLYWAY_ENABLED:true}
  datasource:
    dynamic:
      primary: pg
      strict: false
      lazy: true
      hikari:
        minimum-idle: ${BDLH_DB_MIN_IDLE:1}
        maximum-pool-size: ${BDLH_DB_MAX_POOL_SIZE:8}
        connection-timeout: ${BDLH_DB_CONNECTION_TIMEOUT_MS:3000}
        validation-timeout: ${BDLH_DB_VALIDATION_TIMEOUT_MS:1000}
        leak-detection-threshold: ${BDLH_DB_LEAK_DETECTION_THRESHOLD_MS:0}
      datasource:
        pg:
          url: "jdbc:postgresql://你的PG地址:5432/bdlh_runtime"
          username: "你的PG用户名"
          password: "你的PG密码"
          driver-class-name: org.postgresql.Driver
        mysql:
          url: "jdbc:mysql://你的MySQL地址:3306/platform?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai"
          username: "你的MySQL用户名"
          password: "你的MySQL密码"
          driver-class-name: com.mysql.cj.jdbc.Driver

bdlh_runtime:
  java-data:
    # 生产环境必须开启，防止内部数据接口在无身份凭证时回退单用户模式。
    require-authenticated: true
    internal-token: "使用高强度随机内部令牌"
