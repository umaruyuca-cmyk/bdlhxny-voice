spring:
  # 外置敏感YAML不会进入JAR；本地或云端只需把文件放到启动目录的config子目录。
  # 当前已停用外置YAML自动导入，环境差异统一放在dev或prod配置中。
  profiles:
    active: dev
  application:
    name: bdlh-runtime-data
  flyway:
    enabled: ${BDLH_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: business,runtime,registry
    default-schema: registry
    create-schemas: false
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    connect-retries: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ─── MyBatis-Plus ───
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.bdlh.runtime.handler
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  url: /v3/api-docs
  path: /docs
  page-title: BDLH Agent Runtime API 文档
  theme: purple
  layout: modern
  show-sidebar: true
  hide-models: false
  hide-test-request-button: false
  dark-mode: false

bdlh_runtime:
  single-user:
    # 当前产品为单用户部署，客户端不得自行提交userId
    id: ${BDLH_RUNTIME_SINGLE_USER_ID:1}
  jwt:
    # 生产环境必须通过环境变量覆盖默认密钥
    secret: ${JWT_SECRET:}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  java-data:
    # 生产环境必须设为 true，并由 Python 传递有效用户 JWT；开发环境可回退单用户身份。
    require-authenticated: ${JAVA_DATA_REQUIRE_AUTHENTICATED:false}
    # Python -> Java 的服务间凭证；不得与用户 JWT 或外部 API Key 共用。
    internal-token: ${JAVA_DATA_INTERNAL_TOKEN:}
  rocketmq:
    # P4 默认关闭，只有单节点 Broker/Proxy 与 Topic 初始化完成后才开启。
    enabled: ${ROCKETMQ_ENABLED:false}
    endpoints: ${ROCKETMQ_ENDPOINTS:rmq-broker:8081}
    relay-fixed-delay-ms: ${ROCKETMQ_RELAY_FIXED_DELAY_MS:1000}
    relay-batch-size: ${ROCKETMQ_RELAY_BATCH_SIZE:50}
