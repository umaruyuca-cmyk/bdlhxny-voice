<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockWise · API 联调台</title>
<style>
  :root{--bg:#0b0d12;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.1);--text:#f4f6fb;--dim:#a3a8b8;--faint:#6b7180;--accent:#6e8bff;--green:#34d399;--red:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  h1 small{display:block;color:var(--faint);font-size:12px;font-weight:400;margin-top:6px}
  h2{font-size:14px;margin:26px 0 10px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .links a{color:#fff;background:linear-gradient(135deg,#6e8bff,#8f7bff);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:12px}
  label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
  input,textarea{width:100%;background:#11141c;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
  textarea{min-height:64px;resize:vertical}
  .btn{background:linear-gradient(135deg,#6e8bff,#8f7bff);border:0;color:#fff;font:600 13px ui-monospace,monospace;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:8px}
  .btn.sec{background:#1a1f2e;border:1px solid var(--border);color:var(--dim)}
  pre{background:#05070b;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:280px;overflow:auto;color:#9fe8a0}
  .ok{color:var(--green)}.err{color:var(--red)}.dim{color:var(--faint);font-size:11px}
  .sselive{color:#7dd3fc}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;background:rgba(110,139,255,.15);color:#a9bdff;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>StockWise API 联调台
    <small>前端 dev-server 会将 /api/* 代理到后端。用于对接前逐项验证接口契约。</small>
  </h1>

  <h2>页面联动入口</h2>
  <div class="card links">
    <a href="/">首页</a>
    <a href="/agent?name=general">智能问答</a>
    <a href="/agent?name=stock">股市分析</a>
    <a href="/stockwise-chat.html?mode=general">旧版聊天</a>
    <a href="/stockwise-chat-soft.html?mode=stock">旧版聊天·柔版</a>
  </div>

  <h2>1 · 流式对话 SSE <span class="badge">POST /api/v1/chat/stream</span></h2>
  <div class="card">
    <label>mode</label>
    <select id="mode"><option value="general">general</option><option value="stock">stock</option></select>
    <label>sessionId（留空自动生成）</label>
    <input id="sid" placeholder="自动生成">
    <label>message</label>
    <textarea id="msg">今天哪些行业板块最强？请展示热度组成。</textarea>
    <label>instrument（stock 模式可选）</label>
    <input id="inst" placeholder='{"symbol":"588200","assetType":"ETF"} 或留空'>
    <button class="btn" id="streamBtn">发送并接收 SSE</button>
    <button class="btn sec" id="streamStop">中止</button>
    <pre id="streamOut">等待请求…</pre>
  </div>

  <h2>2 · 运行追踪 <span class="badge">GET /api/v1/agent-runs</span></h2>
  <div class="card">
    <button class="btn sec" id="runsBtn">最近 20 条</button>
    <label>查询单条 runId</label>
    <input id="runId" placeholder="粘贴 runId">
    <button class="btn sec" id="runBtn">查询</button>
    <pre id="runsOut">—</pre>
  </div>

  <p class="dim">提示：所有请求经 dev-server 代理；后端不可用时显示 502 BACKEND_UNAVAILABLE。</p>
</div>

<script>
  const $=id=>document.getElementById(id);
  let aborter=null;

  async function load() {
    // sid 生成
    if(!$("sid").value) $("sid").value = (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));

    // 1) SSE stream
    $("streamBtn").addEventListener("click", async () => {
      const out=$("streamOut");
      out.textContent="连接中…\n"; out.className="sselive";
      const instrumentText=$("inst").value.trim();
      let instrument=null;
      if(instrumentText){try{instrument=JSON.parse(instrumentText);}catch(e){out.textContent+="instrument JSON 无效\n";return}}
      aborter=new AbortController();
      try{
        const res=await fetch("/api/v1/chat/stream",{
          method:"POST",
          headers:{"Content-Type":"application/json","Accept":"text/event-stream"},
          body:JSON.stringify({sessionId:$("sid").value, mode:$("mode").value, message:$("msg").value, instrument}),
          signal:aborter.signal
        });
        out.textContent+="HTTP "+res.status+" "+res.statusText+"\n";
        if(!res.ok){ out.textContent+=await res.text(); return; }
        const reader=res.body.getReader(); const dec=new TextDecoder();
        let buf="",count=0;
        while(true){
          const {value,done}=await reader.read();
          if(done)break;
          buf+=dec.decode(value||new Uint8Array(),{stream:!done}).replace(/\r\n/g,"\n");
          let idx;
          while((idx=buf.indexOf("\n\n"))>=0){
            const frame=buf.slice(0,idx); buf=buf.slice(idx+2);
            const data=frame.split("\n").filter(l=>l.startsWith("data:")).map(l=>l.slice(5).trimStart()).join("\n");
            if(data){ count++; out.textContent+=("["+count+"] "+data+"\n"); out.scrollTop=out.scrollHeight; }
          }
        }
        out.className="ok";
      }catch(e){ out.className="err"; out.textContent+="ERR: "+e.message+"\n"; }
    });
    $("streamStop").addEventListener("click",()=>{ if(aborter) aborter.abort(); $("streamOut").textContent+="\n已中止\n"; });

    // 3) runs
    $("runsBtn").addEventListener("click", async () => {
      const out=$("runsOut"); out.textContent="请求中…";
      try{
        const res=await fetch("/api/v1/agent-runs?limit=20");
        out.textContent="HTTP "+res.status+"\n"+await res.text();
        out.className=res.ok?"ok":"err";
      }catch(e){ out.className="err"; out.textContent="ERR: "+e.message; }
    });
    $("runBtn").addEventListener("click", async () => {
      const out=$("runsOut"); out.textContent="请求中…";
      const id=$("runId").value.trim(); if(!id){out.textContent="请输入 runId";return}
      try{
        const res=await fetch("/api/v1/agent-runs/"+encodeURIComponent(id));
        out.textContent="HTTP "+res.status+"\n"+await res.text();
        out.className=res.ok?"ok":"err";
      }catch(e){ out.className="err"; out.textContent="ERR: "+e.message; }
    });
  }
  load();
</script>
</body>
</html>
