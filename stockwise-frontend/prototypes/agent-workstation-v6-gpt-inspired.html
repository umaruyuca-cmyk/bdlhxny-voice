<body>
  <div class="app">
    <aside class="dock" aria-label="工作站导航"><div class="dock-logo"><span>工作站</span></div><nav class="dock-nav"><button class="dock-btn active" aria-label="对话">◌</button><button class="dock-btn" aria-label="Agent">◇</button><button class="dock-btn" aria-label="运行记录" id="dockTrace">⌁</button></nav><div class="sidebar-recent"><div class="sidebar-label">最近</div><button class="recent-link">Agent 设计工作台</button><button class="recent-link">昨日科技板块复盘</button><button class="recent-link">贵州茅台研究</button><button class="recent-link">SearXNG 架构分析</button></div><div class="dock-user" aria-hidden="true"></div></aside>
    <main class="workspace">
      <header class="topbar"><div class="wordmark"><i></i><span>Agent 工作台</span></div><div class="top-actions"><div class="mode-toggle" role="tablist" aria-label="工作模式"><button class="active" role="tab">聊天</button><button role="tab">工作</button></div><button class="quiet-btn" id="traceTrigger">运行</button><button class="session-pill" id="sessionTrigger"><span><strong id="sessionTitle">新建研究会话</strong><small id="sessionMeta">通用问答 · 尚未开始</small></span><b>⌄</b></button></div></header>
      <div class="content">
        <nav class="agent-switcher" aria-label="Agent模式"><button class="agent-tab active" data-agent="general">通用问答</button><button class="agent-tab" data-agent="stock">股票分析</button><button class="agent-tab" data-agent="market">市场扫描</button></nav>
        <section class="messages" id="messages"><div class="empty" id="emptyState"><div class="empty-kicker"><b></b><span id="emptyKicker">工作站已就绪</span></div><h1 id="emptyTitle">今天想一起解决什么？</h1><p id="emptyDesc">选择一个 Agent，剩下的交给我。</p><div class="starter-grid"><button class="starter" data-starter="把这段内容整理成要点"><strong>整理一段内容</strong><small>提炼重点与下一步动作</small></button><button class="starter" data-starter="用简单的方式解释这个概念"><strong>解释一个概念</strong><small>换一种更容易理解的表达</small></button><button class="starter" data-starter="分析一下 600519 贵州茅台"><strong>开始标的分析</strong><small>确认标的后进入分析流程</small></button></div></div></section>
        <div class="composer-wrap"><form class="composer" id="composer"><input id="prompt" autocomplete="off" placeholder="输入问题，或让角色帮你开始…"><button class="send" aria-label="发送">↑</button></form><div class="composer-tools"><button type="button">＋ 添加文件</button><button type="button">⌘ Agent 工具</button><span>自动路由 · 低噪声模式</span></div><div class="composer-meta"><span>Enter 发送 · Shift + Enter 换行</span><span id="modeHint">聊天模式 · 通用问答</span></div></div>

    function openSessions(){renderSessions();$('#sessionModal').classList.add('open');$('#sessionModal').setAttribute('aria-hidden','false')}
    function closeSessions(){$('#sessionModal').classList.remove('open');$('#sessionModal').setAttribute('aria-hidden','true')}
    function renderSessions(){$('#sessionList').innerHTML=sessions.map(s=>`<button class="session-item ${s.id===activeSession?'active':''}" data-session="${s.id}"><span class="session-icon">◌</span><span><strong>${s.title}</strong><small>${s.meta}</small></span><b>${s.id===activeSession?'当前':''}</b></button>`).join('');$$('[data-session]').forEach(b=>b.onclick=()=>{activeSession=Number(b.dataset.session);const s=sessions.find(x=>x.id===activeSession);$('#sessionTitle').textContent=s.title;syncAgent();closeSessions()})}
    function ask(text){if(!text.trim())return;$('#emptyState')?.remove();const box=$('#messages');const u=document.createElement('div');u.className='message user';u.innerHTML=`<div><div class="message-meta">你 · 刚刚</div><div class="bubble">${text}</div></div>`;box.appendChild(u);const a=agents[activeAgent];const r=document.createElement('div');r.className='message';r.innerHTML=`<div class="message-meta">${a.name} · 已完成</div><div class="answer"><div class="answer-head"><div class="answer-agent">${a.name}</div><span class="answer-status">已完成</span></div><p>${activeAgent==='stock'?'我会围绕标的、趋势和风险给出结构化判断。当前建议先确认分析标的，再进入详细流程。':'这是一个适合继续拆解的问题。我已整理出清晰的回答方向，可以从结论、依据或下一步动作继续。'}</p><h3>建议下一步</h3><div class="evidence"><div><b>01</b>明确问题范围和时间窗口</div><div><b>02</b>查看关键依据，再决定是否深入</div></div><div class="followups"><button class="followup">展开关键依据</button><button class="followup">换一种方式解释</button><button class="followup">继续下一步</button></div></div>`;box.appendChild(r);box.scrollTop=box.scrollHeight;$('#traceTitle').textContent='回答已完成';$('#traceSummary').textContent='已执行 3 个关键步骤';$('#traceRoute').classList.add('done');$('#traceAnswer').classList.add('done');$('#sessionTitle').textContent=text.slice(0,18);sessions[0].title=text.slice(0,18);sessions[0].meta=a.name+' · 刚刚';activeSession=1;$$('.followup').forEach(b=>b.onclick=()=>{$('#prompt').value=b.textContent;$('#prompt').focus()})}
    $$('.agent-tab').forEach(b=>b.onclick=()=>{activeAgent=b.dataset.agent;syncAgent();companion.classList.remove('is-minimized');companion.classList.add('is-active');setTimeout(()=>companion.classList.remove('is-active'),1800)});$$('.starter').forEach(b=>b.onclick=()=>{$('#prompt').value=b.dataset.starter;$('#prompt').focus()});$('#composer').onsubmit=e=>{e.preventDefault();const v=$('#prompt').value;$('#prompt').value='';ask(v);companion.classList.remove('is-open','is-done');companion.classList.add('is-thinking');$('#companionStatus').textContent='THINK';setTimeout(()=>{companion.classList.remove('is-thinking');companion.classList.add('is-done','is-active');$('#companionStatus').textContent='DONE';$('#companionBubble').textContent='回答完成了。点我可以继续追问。';setTimeout(()=>{companion.classList.remove('is-done','is-active');$('#companionStatus').textContent='READY'},2300)},430)};$('#sessionTrigger').onclick=openSessions;$('#closeModal').onclick=closeSessions;$('#sessionModal').onclick=e=>{if(e.target.id==='sessionModal')closeSessions()};$('#newSession').onclick=()=>{sessions.unshift({id:Date.now(),title:'新建研究会话',meta:agents[activeAgent].name+' · 尚未开始'});activeSession=sessions[0].id;$('#sessionTitle').textContent='新建研究会话';$('#messages').innerHTML='<div class="empty" id="emptyState"><div class="empty-kicker"><b></b><span>工作站已就绪</span></div><h1>今天想一起解决什么？</h1><p>选择一个 Agent，剩下的交给我。</p></div>';closeSessions()};
    $('#companionToggle').onclick=()=>{companion.classList.toggle('is-open');$('#companionBubble').textContent=companion.classList.contains('is-open')?'需要什么，直接从这里选。':agents[activeAgent].copy};$('#companionRestore').onclick=()=>{companion.classList.remove('is-minimized');companion.classList.add('is-active');setTimeout(()=>companion.classList.remove('is-active'),1400)};$$('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;if(action==='suggest'){$('#prompt').value=activeAgent==='stock'?'继续分析当前标的的风险、支撑位和关键验证条件':'请把刚才的结论整理成三个可执行步骤';$('#prompt').focus()}if(action==='trace'){$('#traceDrawer').classList.add('open')}if(action==='session')openSessions();if(action==='minimize')companion.classList.add('is-minimized');companion.classList.remove('is-open')});$('#traceTrigger').onclick=()=>$('#traceDrawer').classList.toggle('open');$('#dockTrace').onclick=()=>$('#traceDrawer').classList.toggle('open');$$('.mode-toggle button').forEach(button=>button.onclick=()=>{activeMode=button.textContent.trim()==='工作'?'work':'chat';$$('.mode-toggle button').forEach(x=>x.classList.toggle('active',x===button));$('#emptyTitle').textContent=activeMode==='work'?'今天要推进哪个任务？':'今天想一起解决什么？';$('#emptyDesc').textContent=activeMode==='work'?'选择 Agent，把问题推进到可执行结论。':'选择一个 Agent，剩下的交给我。';syncAgent()});$$('.recent-link').forEach(link=>link.onclick=()=>{$('#sessionTitle').textContent=link.textContent.trim()});syncAgent();
  </script>
</body>
