<main class="docs-main">
  <div class="eyebrow">Experiments</div>
  <h1>实验模板</h1>
  <p class="page-sub">正式实验以「实验模板 + 唯一自变量」定义:每个模板只改变一个受控变量,其余条件(模型参数、循环实现、工具目录、Mock 与治理配置)冻结进运行配置快照并计算 config_hash。选择模板后进入统一发起页预估精确运行数,再提交批次。</p>

  <div id="tplList" class="tpl-grid"><div class="placeholder-block">正在读取实验模板注册表…</div></div>

  <p class="note">灰色「需登录」卡仅登录所有者可发起,未登录仍可查看其定义;能否发起以服务端角色校验为准。压缩用例(三个版本化长 Session × 四种上下文方式)有<a href="/experiment/compression">独立入口</a>;已发起的批次见<a href="/experiment/batches">批次列表</a>,匿名测试记录见<a href="/test/">我的测试</a>。</p>
</main>

<script src="/docs/experiment.js"></script>
<script>
(function () {
  "use strict";
  var listEl = document.getElementById("tplList");
  var selectedCase = new URLSearchParams(location.search).get("case") || "";

  function render(payload) {
    var templates = (payload && payload.templates) || [];
    var owner = !!(payload && payload.owner);
    if (!templates.length) {
      listEl.innerHTML = '<div class="placeholder-block">实验模板注册表不可读(需要运行服务);压缩用例入口仍可用。</div>';
      return;
    }
    listEl.innerHTML = templates.map(function (t) {
      var locked = !owner && t.anonymous_allowed === false;
      var card = EXP.templateCardHtml(t, locked);
      if (locked) {
        return '<div class="tpl-link" title="登录后可发起">' + card + "</div>"; // 锁定卡不可点:与原型一致,仅展示
      }
      var href = "/experiment/run?template=" + encodeURIComponent(t.template_id);
      if (selectedCase && (t.allowed_test_types || []).indexOf("COMPARISON_CASE") >= 0) {
        href += "&case=" + encodeURIComponent(selectedCase);
      }
      return '<a class="tpl-link" href="' + href + '">' + card + "</a>";
    }).join("");
  }

  EXP.loadTemplates().then(render).catch(function () {
    listEl.innerHTML = '<div class="placeholder-block">实验模板注册表不可读(需要运行服务);压缩用例入口仍可用。</div>';
  });
})();
</script>
<style>
.tpl-link { text-decoration: none; color: inherit; display: block; }
.tpl-grid .tpl-link .tpl-card { height: 100%; }
</style>
