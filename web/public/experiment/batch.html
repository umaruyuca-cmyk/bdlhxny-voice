    <a class="crumb" href="/test/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回运行记录</a>
    <div class="eyebrow">Batch Result</div>
    <h1 id="batchTitle">批次详情</h1>
    <div id="batchMeta" class="lab-note" style="margin-bottom:12px">正在解析批次标识…</div>
    <div id="jobBox" class="exp-panel" style="display:none;padding:14px 18px"></div>
    <div id="batchWarn" class="warn-bar" style="display:none"></div>
    <div id="mainPanels" style="display:none">
      <div class="exp-panel" id="caliber" style="margin-bottom:16px">
        <h2 style="font-size:15px;margin-top:0">实验口径</h2>
        <ul class="def-list" id="defList"></ul>
      </div>
      <div class="exp-panel" id="params" style="margin-bottom:16px">
        <h2 style="font-size:15px;margin-top:0">请求参数与实际生效参数</h2>
        <div id="paramBox"></div>
        <p class="note-line">生效值为 null 表示该参数未被模型接受;平台不会将未生效参数记录为已生效,原因见说明列。</p>
      </div>
      <div class="exp-panel" id="result">
        <h2 style="font-size:15px;margin-top:0" id="resultTitle">结果</h2>
        <div id="resultBox"><div class="placeholder-block">尚未运行。</div></div>

</main>
<script src="/docs/docs.js"></script>
<script src="/docs/experiment.js"></script>
<script>
(function () {
  "use strict";
  console.log("[batch] 页面版本 20260829-1(单次运行明细:时间线+折叠证据+参数三态)"); // 缓存自查:console 应出现此行
  var E = window.EXP;
  var params = new URLSearchParams(location.search);
  var pathId = decodeURIComponent(location.pathname.replace(/^\/experiment\/batch\/?/, "").replace(/\/+$/, ""));
  var batchId = pathId || params.get("id") || "";
  var ownerJobId = params.get("job") || "";
  var templateCache = {};

  function fail(message) {
    document.getElementById("batchMeta").style.display = "none";
    var box = document.getElementById("batchError");
    box.style.display = "block";
    box.innerHTML = E.esc(message) + ' <a href="/test/">返回运行记录</a>';
  }
  function meta(html) { document.getElementById("batchMeta").innerHTML = html; }
  function showWarn(text) {
    var bar = document.getElementById("batchWarn");
    bar.style.display = "block";
    bar.textContent = text;
  }

  function templateMap() {
    if (templateCache.done) return Promise.resolve(templateCache);
    return E.loadTemplates().then(function (payload) {
      (payload.templates || []).forEach(function (t) { templateCache[t.template_id] = t; });
      templateCache.done = true;
      return templateCache;
    }).catch(function () { templateCache.done = true; return templateCache; });
  }

  var MODEL_PARAMS = [
    ["temperature", "采样温度"],
    ["top_p", "核采样阈值"],
    ["reasoning_effort", "推理力度"],
    ["seed", "随机种子"],
    ["tool_choice", "工具选择"],
    ["parallel_tool_calls", "并行工具调用"],
    ["max_output_tokens", "输出上限"],
  ];
  function paramTable(model, applied) {
    applied = applied || {};
    var reasons = (model && model.unsupported_reasons) || [];
    var rows = MODEL_PARAMS.map(function (pair) {
      var name = pair[0];
      var requested = model ? model[name + "_requested"] : undefined;
      var effective = model ? model[name + "_effective"] : undefined;
      if (requested === undefined && effective === undefined && applied[name] === undefined) return "";
      var appliedValue = applied[name] !== undefined ? applied[name] : effective;
      var shown = requested === undefined ? "—" : requested;
      var note = "—";
      if (requested != null && appliedValue == null && effective == null) {
        var hit = reasons.filter(function (r) { return String(r).indexOf(name) === 0; });
        note = hit.length ? hit.join(";") : "模型适配器未确认支持,未生效";
      }
      return '<tr><td class="mono">' + E.esc(name) + '</td><td class="mono">' + E.esc(shown) + "</td>" +
        '<td class="mono' + (requested != null && appliedValue == null && effective == null ? " null-cell" : "") + '">' +
        E.esc(appliedValue == null && effective == null ? "null" : appliedValue) + "</td><td>" + E.esc(note) + "</td></tr>";
    }).join("");
    if (!rows) return '<div class="placeholder-block">无模型参数记录。</div>';
    return '<table class="exp-table"><tr><th>参数</th><th>请求值</th><th>生效值</th><th>说明</th></tr>' + rows + "</table>";
  }

  /* 进度区(所有者作业或匿名任务,轮询 + 协作取消;onDone 在运行态结束时触发一次)。
     getFn 的 404(内存作业随服务重启清除)映射为 status="gone" 终止态:轮询停止并回刷批次,
     页面不能停留在最后一次成功轮询的「进行中」快照上。 */
  function renderProgress(getFn, cancelFn, isActive, onDone) {
    var box = document.getElementById("jobBox");
    var wasActive = null;
    function draw(data) {
      var gone = data.status === "gone";
      var done = data.completed_units != null ? data.completed_units
        : ((data.progress && data.progress.done != null) ? data.progress.done : null);
      var total = data.total_units != null ? data.total_units : ((data.progress && data.progress.total) || 0);
      var current = (data.progress && data.progress.current) || "";
      var phase = (data.progress && data.progress.phase) || "";
      var zeroTotal = !(total > 0); // 生成类作业(0 个 Agent 运行):无总量可计
      var hasCount = typeof done === "number";
      var active = isActive(data);
      var scaleText;
      if (gone) {
        scaleText = "作业进度记录已随服务重启清除;批次最终状态见下方与批次列表";
      } else if (zeroTotal) {
        scaleText = active
          ? (phase ? "正在:" + E.esc(phase) : "上下文生成中…")
          : "已完成 · 上下文生成(0 个 Agent 运行)";
      } else if (hasCount) {
        scaleText = done + "/" + total +
          (active && phase ? " · 正在:" + E.esc(phase)
            : (current ? " · 最近完成:" + E.esc(current) : ""));
      } else {
        // done 未逐运行计数(旧入口):如实说明,不用假百分比冒充进度
        scaleText = "共 " + total + " 次运行 · 完成后一次性更新(本入口不逐次计数)" +
          (phase ? " · 正在:" + E.esc(phase) : "");
      }
      // 进度条只在「活动 + 总量已知 + 逐次计数」时渲染真实比例;
      // 排队/生成上下文/汇总/完成/失败/清除态一律只用文字表达,不出现无依据的百分比或满格装饰条。
      var showBar = active && !gone && hasCount && total > 0;
      var barHtml = "";
      if (showBar) {
        var pct = Math.min(100, Math.max(0, Math.round(done * 100 / total)));
        barHtml = '<div class="prog" style="margin-top:8px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct +
          '" aria-label="已完成 ' + done + " / " + total + ' 个运行">' +
          '<div class="prog-bar" style="width:' + pct + '%"></div></div>';
      }
      var status = gone ? "作业记录已清除" : E.jobStatusLabel(data.status);
      var cancelBtn = active ? ' <button type="button" class="btn-ghost" id="cancelRun">取消(仅阻止未开始的运行)</button>' : "";
      // 调用/缓存统计(§11.2 口径):只展示作业预算累计的真实请求,不把缓存命中算作调用
      var statsHtml = "";
      var result = data.result || {};
      var budget = result.budget;
      if (budget && (budget.llm_requests || budget.input_tokens || budget.cost)) {
        statsHtml = '<div class="lab-note" style="margin-top:6px">真实 LLM 请求 <b>' + E.esc(budget.llm_requests || 0) +
          "</b> · 输入 Token <b>" + E.esc(budget.input_tokens || 0) + "</b>" +
          (budget.cost ? " · 估算费用 <b>" + E.esc(budget.cost) + "</b>" : "") + "(缓存命中不计入调用)</div>";
      }
      box.style.display = "block";
      box.innerHTML = "<div><b>" + status + "</b> · " + scaleText + cancelBtn + "</div>" +
        barHtml + statsHtml +
        (data.error ? '<div class="lab-note" style="color:#b91c1c">错误:' + E.esc(data.error) + "</div>" : "") +
        (result.budget_terminated ? '<div class="lab-note" style="color:#b91c1c">' + E.esc(result.budget_terminated) + "</div>" : "");
      var btn = document.getElementById("cancelRun");
      if (btn) {
        btn.addEventListener("click", function () {
          cancelFn().then(function () { getFn().then(draw).catch(function () {}); }).catch(function () {});
        });
      }
      // 进入非运行态即回刷一次:包括首帧就已终止(页面在批次结束后才打开)与运行中转终态
      if (!active && wasActive !== false && onDone) onDone(data);
      wasActive = active;
    }
    function guardedGet() {
      return getFn().catch(function (err) {
        if (err && err.status === 404) return { status: "gone" };
        throw err;
      });
    }
    E.poll(guardedGet, draw, function (data) { return isActive(data) && data.status !== "gone"; });
  }

  /* 匿名任务视图(公开测试接口;个人测试 · 非正式结果) */
  function renderJobView(jobId) {
    var getJob = function () { return E.get("/api/v1/public/test-jobs/" + encodeURIComponent(jobId)); };
    function draw(job) {
      var badges = E.badge("b-blue", "个人测试 · 非正式结果");
      var result = job.result || {};
      var cls = job.template_id ? (result.classification || "") : "";
      var heading = job.template_id ? E.title({ template_id: job.template_id }) : "批次详情";
      document.getElementById("batchTitle").innerHTML = heading + " " + badges + (cls ? " " + E.classificationBadge(cls) : "");
      meta("任务 " + E.hashChip(job.job_id) + " · 发起于 " + E.fmtTime(job.created_at) + " · " +
        (job.test_type === "COMPRESSION_CASE" ? "压缩用例" : "对比用例") + " · 状态 " + E.jobStatusLabel(job.status));
      if (job.template_id) {
        var def = result.fixed_conditions || {};
        templateMap().then(function (cache) {
          var t = cache[job.template_id];
          var rawVariants = def.variant_labels || (t ? (t.variants || []).map(function (v) { return v.label; }) : []);
          var variants = t ? rawVariants.map(function (v) { return E.variantLabel(t, v); }) : rawVariants;
          var frozenModel = (def.frozen_run_config && def.frozen_run_config.model) || {};
          var firstRun = (result.runs || [])[0] || {};
          document.getElementById("defList").innerHTML =
            '<li><span class="k">实验目的</span><span>' + E.esc(t ? t.purpose : job.template_id) + "</span></li>" +
            '<li><span class="k">受控变量</span><span><b>' + E.esc(t ? E.varLabel(t) : (def.independent_variable || []).join(",")) + "</b>" +
            (variants.length ? " — " + E.esc(variants.join(" / ")) : "") + "</span></li>" +
            '<li><span class="k">冻结条件</span><span>统一原生底座、服务端模型配置、平台工具目录与冻结数据;批次中仅受控变量不同。重复 ' + E.esc(def.repeat_count || job.repeat_count) + " 次。</span></li>" +
            '<li><span class="k">技术口径</span><span class="tpl-tech">' + E.esc(job.template_id) + " v" + E.esc(job.template_version || (t ? t.version : "?")) +
            " · variable: " + E.esc((def.independent_variable || (t ? t.independent_variable : [])).join(",")) +
            " · fixed " + E.hashChip(result.fixed_conditions_hash || "") + "</span></li>";
          document.getElementById("paramBox").innerHTML = paramTable(frozenModel, firstRun.applied_model_params);
        });
      } else {
        document.getElementById("defList").innerHTML =
          '<li><span class="k">实验目的</span><span>公开通道测试任务(非模板批次);实验定义以任务固定条件为准。</span></li>' +
          '<li><span class="k">任务范围</span><span>' + E.esc(job.execution_scope || "") + " · " + (job.session_id ? "Session " + E.esc(job.session_id) : "用例 " + E.esc(job.case_id || "")) + "</span></li>" +
          '<li><span class="k">固定条件哈希</span><span>' + E.hashChip(result.fixed_conditions_hash || "") + "</span></li>";
        document.getElementById("paramBox").innerHTML = '<div class="placeholder-block">公开测试通道不展示参数对照表(逐单元明细见「我的测试」)。</div>';
      }
      document.getElementById("mainPanels").style.display = "block";
      renderJobResult(job);
      if (E.jobActive(job.status)) {
        renderProgress(getJob, function () {
          return E.post("/api/v1/public/test-jobs/" + encodeURIComponent(jobId) + "/cancel");
        }, function (data) { return E.jobActive(data.status); });
        E.poll(getJob, function (fresh) { renderJobResult(fresh); }, function (data) { return E.jobActive(data.status); }, 5000);
      }
    }
    getJob().then(draw).catch(function (err) {
      if (err.status === 404) fail("批次不存在或无权查看:匿名任务仅本人可见(404 不泄露存在性);所有者批次需登录后查看。");
      else fail("任务读取失败:" + (err.message || "服务不可达"));
    });
  }

  function renderJobResult(job) {
    var box = document.getElementById("resultBox");
    var result = job.result || {};
    if (job.status === "QUEUED" || job.status === "RUNNING") {
      var units = job.units || [];
      var doneCount = units.filter(function (u) { return u.status === "COMPLETE"; }).length;
      box.innerHTML = '<div class="placeholder-block">批次进行中:已完成 ' + doneCount + "/" + units.length + " 单元;结果完成后在此展示。</div>";
      return;
    }
    if (job.template_id && result.by_variant) {
      document.getElementById("resultTitle").textContent = "结果 · 按受控变量分组";
      var rows = Object.keys(result.by_variant).map(function (label) {
        var v = result.by_variant[label];
        return "<tr><td>" + E.esc(label) + "</td><td>" + v.total_runs + "</td>" +
          '<td class="cell-ok">' + v.valid_runs + "</td>" +
          '<td class="mono">' + E.esc(v.bypassed_event_count || 0) + "</td>" +
          '<td class="mono">' + E.esc((v.stop_reasons || []).join("、") || "—") + "</td></tr>";
      }).join("");
      var runsHtml = (result.runs || []).map(function (r) {
        return "<tr><td>" + E.esc(r.variant_label) + " · 第" + ((r.repeat_index || 0) + 1) + "次</td>" +
          "<td>" + (r.validity === "VALID" ? '<span class="cell-ok">有效</span>' : '<span class="null-cell">' + E.esc(r.validity || "无效") + "</span>") + "</td>" +
          '<td class="mono">' + E.esc(r.actual_agent_steps || "—") + "</td>" +
          '<td class="mono">' + E.esc(r.stop_reason || "—") + "</td>" +
          '<td class="mono">' + E.esc(r.duration_ms || "—") + " ms</td>" +
          "<td>" + E.hashChip(r.config_hash) + "</td></tr>";
      }).join("");
      box.innerHTML = '<table class="exp-table"><tr><th>分组</th><th>运行数</th><th>有效</th><th>旁路事件</th><th>停止原因</th></tr>' + rows + "</table>" +
        '<h3 style="font-size:14px;margin:18px 0 6px">逐次运行(' + (result.runs || []).length + ")</h3>" +
        '<table class="exp-table"><tr><th>运行</th><th>有效性</th><th>步数</th><th>停止原因</th><th>耗时</th><th>config_hash</th></tr>' + runsHtml + "</table>" +
        ((result.skipped_run_ids || []).length ? '<p class="note-line">取消后未执行的运行:' + E.esc(result.skipped_run_ids.join("、")) + "</p>" : "");
      return;
    }
    if (job.execution_scope === "context-only") {
      var stats = result.stats || {};
      var details = result.compression_details || {};
      var variantNames = { "full-session": "完整上下文", "recent-window": "最近窗口", "single-summary": "单轮摘要", "budgeted-session": "预算化裁剪" };
      var variants = ["full-session", "recent-window", "single-summary", "budgeted-session"];
      var jobIdEnc = encodeURIComponent(job.job_id);

      function decisionList(label, items) {
        if (!items || !items.length) return '<p class="note-line">' + E.esc(label) + ":无</p>";
        return '<p class="note-line"><b>' + E.esc(label) + "(" + items.length + ")</b>:" +
          items.map(function (it) {
            return '<span class="mono">' + E.esc(it.id) + "</span> " + E.esc(it.excerpt || "");
          }).join("；") + "</p>";
      }

      var rows = variants.map(function (v) {
        var d = details[v] || {};
        var c = d.counts || {};
        var orig = (stats.original_tokens || {})[v];
        var work = (stats.working_tokens || {})[v];
        var detailRows = "";
        if ((d.compressed_items || []).length || (d.omitted_items || []).length) {
          detailRows = '<tr><td colspan="5" style="text-align:left;background:#fafbfc">' +
            '<details class="metric-def"><summary>压缩决策明细(' + E.esc(variantNames[v]) + ')</summary>' +
            decisionList("被压缩", d.compressed_items) + decisionList("被丢弃", d.omitted_items) +
            ((d.warnings || []).length ? '<p class="note-line">警告:' + E.esc(d.warnings.join("；")) + "</p>" : "") +
            "</details></td></tr>";
        }
        return "<tr><td>" + E.esc(variantNames[v]) + "</td>" +
          '<td class="mono">' + E.esc(orig != null ? orig : "—") + " → " + E.esc(work != null ? work : "—") + "</td>" +
          '<td class="mono">' + E.esc(c.kept != null ? c.kept : "—") + " / " + E.esc(c.compressed || 0) + " / " +
          E.esc(c.referenced || 0) + " / " + E.esc(c.omitted || 0) + "</td>" +
          "<td>" + (d.required_retained === false ? '<span class="null-cell">否</span>' : '<span class="cell-ok">是</span>') + "</td>" +
          '<td><button type="button" class="btn ghost" style="padding:2px 10px;font-size:12px" data-art="' + v + '">下载工件</button></td></tr>' +
          detailRows;
      }).join("");

      box.innerHTML = '<table class="exp-table"><tr><th>上下文方式</th><th>Token 压缩前 → 后</th><th>保留/压缩/引用/丢弃</th><th>强制项保留</th><th>工件</th></tr>' +
        rows + "</table>" +
        '<p class="note-line">压缩为确定性代码构建(规则分类 + 预算选择 + 抽取式摘要),不调用模型;本任务 0 个 Agent 运行。完整对照见<a href="/context/library">长上下文库</a>;工件含实际喂给模型的完整消息序列。</p>';

      Array.prototype.forEach.call(box.querySelectorAll("button[data-art]"), function (btn) {
        btn.addEventListener("click", function () {
          btn.disabled = true;
          fetch("/api/v1/public/test-jobs/" + jobIdEnc + "/context-artifacts/" + btn.getAttribute("data-art"))
            .then(function (res) {
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.blob();
            })
            .then(function (blob) {
              var a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = btn.getAttribute("data-art") + ".json";
              document.body.appendChild(a);
              a.click();
              a.remove();
              btn.disabled = false;
            })
            .catch(function () {
              btn.disabled = false;
              btn.textContent = "下载失败";
            });
        });
      });
      return;
    }
    var units = job.units || [];
    box.innerHTML = '<table class="exp-table"><tr><th>单元</th><th>结果</th><th>步数</th><th>停止原因</th><th>耗时</th></tr>' +
      units.map(function (u) {
        return "<tr><td>" + E.esc((u.context_variant ? u.context_variant + " × " : "") + u.agent_mode_id + " · 第" + ((u.repeat_index || 0) + 1) + "次") + "</td>" +
          "<td>" + (u.task_success ? '<span class="cell-ok">成功</span>' : '<span class="null-cell">未成功</span>') + (u.validity === "INVALID" ? ' <span class="null-cell">无效</span>' : "") + "</td>" +
          '<td class="mono">' + E.esc(u.actual_agent_steps || "—") + '</td><td class="mono">' + E.esc(u.stop_reason || "—") + '</td><td class="mono">' + E.esc(u.duration_ms || "—") + " ms</td></tr>";
      }).join("") + "</table>" +
      (job.error ? '<p class="note-line">错误:' + E.esc(job.error) + "</p>" : "");
  }

  /* 所有者批次视图(数据服务口径卡 + 请求/生效参数 + 变量分组矩阵) */
  function ownerMeta(batch) {
    meta("批次 " + E.hashChip(batch.id) + " · " + E.esc(batch.name || "") + " · 创建 " + E.fmtTime(batch.createdAt) +
      " · " + E.batchStatusLabel(batch.status) + " · " + (batch.runs || []).length + " 次运行");
  }

  function renderOwnerView(batch) {
    var fc = batch.fixedConditions || {};
    var noTemplate = !fc.template_id;
    var cls = fc.template_classification || "";
    var heading = fc.template_id ? E.title({ template_id: fc.template_id }) : "批次详情";
    document.getElementById("batchTitle").innerHTML = heading + " " +
      (noTemplate ? E.esc("无模板") : E.classificationBadge(cls));
    if (cls === "special-cross") showWarn("专项交叉模板:一次改变两个条件,结果不可归因于单一变量。");
    ownerMeta(batch);

    templateMap().then(function (cache) {
      var t = cache[fc.template_id];
      var rawVariants = fc.variant_labels || (t ? (t.variants || []).map(function (v) { return v.label; }) : []);
      var variants = t ? rawVariants.map(function (v) { return E.variantLabel(t, v); }) : rawVariants;
      var frozen = fc.frozen_run_config || {};
      var firstRun = (batch.runs || [])[0] || {};
      var mc = firstRun.modelConfig || {};
      var perRun = mc.perRunConfig || {};
      var tools = perRun.tools || {};
      var excluded = tools.excluded_tools || [];
      document.getElementById("defList").innerHTML =
        '<li><span class="k">实验目的</span><span>' + E.esc(t ? t.purpose : (fc.template_id || "无模板批次")) + "</span></li>" +
        '<li><span class="k">受控变量</span><span><b>' + E.esc(t ? E.varLabel(t) : (fc.independent_variable || []).join(",")) + "</b>" +
        (variants.length ? " — " + E.esc(variants.join(" / ")) : "") + "</span></li>" +
        '<li><span class="k">冻结条件</span><span>' + E.esc(frozenSummary(frozen, fc)) + ";批次中仅受控变量不同。</span></li>" +
        '<li><span class="k">技术口径</span><span class="tpl-tech">' + E.esc(fc.template_id || "无模板") + " v" + E.esc(fc.template_version || "?") +
        " · variable: " + E.esc((fc.independent_variable || []).join(",")) +
        " · config " + E.hashChip(mc.configHash || "") + " · fixed " + E.hashChip(fc.fixed_conditions_hash || "") + "</span></li>" +
        '<li><span class="k">工具可见性</span><span>' +
        (excluded.length ? "排除 " + excluded.length + " 项(" + excluded.slice(0, 3).join(", ") + (excluded.length > 3 ? "…" : "") + ")"
          : "完整目录可见(无排除)") +
        " · 目录 " + E.esc(tools.catalog_version || "—") +
        " · Schema 哈希 " + E.hashChip(mc.toolSchemaHash || "") +
        " · 合格目录哈希 " + E.hashChip(mc.eligibleCatalogHash || "") + "</span></li>";
      document.getElementById("paramBox").innerHTML = (function () {
        // 参数对照:优先逐运行快照(perRunConfig),无运行(context-only)回退批次冻结配置;
        // 生效值优先读逐运行实例回读(appliedModelParams),未确认时如实显示 null 与原因
        var appliedParams = mc.appliedModelParams || {};
        var frozenModel = (fc.frozen_run_config || {}).model || {};
        var modelForTable = perRun.model || frozenModel;
        if (!modelForTable || Object.keys(modelForTable).length === 0) {
          return '<div class="placeholder-block">批次进行中:参数对照将在运行落库后展示。</div>';
        }
        return paramTable(modelForTable, appliedParams);
      })();
    });

    document.getElementById("mainPanels").style.display = "block";
    renderOwnerResult(batch);

    var refreshAfterDone = function () {
      // 终态回刷:批次状态/运行数(meta 行)与结果区都要离开「进行中」快照
      E.get("/api/v1/batches/" + encodeURIComponent(batch.id)).then(function (fresh) {
        ownerMeta(fresh);
        renderOwnerResult(fresh);
      }).catch(function () {});
      if (!batch.runs || !batch.runs.length) {
        // 无运行批次:报告两级链(内存作业 → 磁盘工件)
        E.get("/api/v1/jobs/by-batch/" + encodeURIComponent(batch.id)).then(function (job) {
          if (job && job.report && (job.report.compression_details || job.report.by_variant)) {
            renderOwnerReport(job.report);
          } else {
            throw new Error("no-report");
          }
        }).catch(function () {
          E.get("/api/v1/batches/" + encodeURIComponent(batch.id) + "/report")
            .then(renderOwnerReport)
            .catch(function () {});
        });
      }
    };
    if (ownerJobId) {
      renderProgress(function () { return E.get("/api/v1/jobs/" + encodeURIComponent(ownerJobId)); },
        function () { return E.post("/api/v1/jobs/" + encodeURIComponent(ownerJobId) + "/cancel"); },
        function (data) { return data.status === "running"; },
        refreshAfterDone);
    } else {
      // 从批次列表进入(无作业参数):按批次号找回内存作业;找回则显示进度条,否则仅轮询批次状态。
      // 库状态对账:批次在数据库已终态而内存作业仍显示运行(滞后或被外部更新)时,
      // 以库状态为准终止轮询并如实标注,避免「列表失败/详情进行中」的口径撕裂。
      var batchTerminal = ["COMPLETE", "FAILED", "CANCELLED"].indexOf(batch.status) >= 0;
      E.get("/api/v1/jobs/by-batch/" + encodeURIComponent(batch.id)).then(function (job) {
        if (batchTerminal && job.status === "running") {
          renderProgress(
            function () { return Promise.resolve({ status: "done", progress: job.progress }); },
            function () { return Promise.resolve({}); },
            function () { return false; },
            refreshAfterDone);
          return;
        }
        renderProgress(function () { return E.get("/api/v1/jobs/by-batch/" + encodeURIComponent(batch.id)); },
          function () { return E.post("/api/v1/jobs/" + encodeURIComponent(job.job_id) + "/cancel"); },
          function (data) { return data.status === "running"; },
          refreshAfterDone);
      }).catch(function () {
        if (batch.status === "RUNNING") {
          E.poll(function () { return E.get("/api/v1/batches/" + encodeURIComponent(batch.id)); },
            function (fresh) { ownerMeta(fresh); renderOwnerResult(fresh); },
            function (data) { return data.status === "RUNNING"; }, 5000);
        }
      });
    }
  }

  function frozenSummary(frozen, fc) {
    var parts = [];
    if (frozen.execution_engine) parts.push("循环 " + frozen.execution_engine);
    if (frozen.model && frozen.model.model_id) parts.push("模型 " + frozen.model.model_id);
    if (frozen.tools && frozen.tools.catalog_version) parts.push("工具目录 " + frozen.tools.catalog_version);
    if (frozen.fixture_version || fc.fixture_set_id) parts.push("冻结数据 " + (fc.fixture_set_id || frozen.fixture_version));
    if (frozen.judge_version) parts.push("评判 " + frozen.judge_version);
    if (frozen.prompt_version) parts.push("提示词 " + frozen.prompt_version);
    parts.push("重复 " + (fc.repeat_count != null ? fc.repeat_count : "?") + " 次");
    return parts.join(" · ");
  }

  /* 所有者批次作业报告(压缩明细)渲染:context-only 批次的结果主体 */
  function renderOwnerReport(report) {
    var box = document.getElementById("resultBox");
    if (!report) {
      document.getElementById("resultTitle").textContent = "结果 · 压缩明细";
      box.innerHTML = '<div class="placeholder-block">作业报告已不在服务内存(服务重启后清除);本批次为上下文生成(0 个 Agent 运行),完整工件见批次工件目录。</div>';
      return;
    }
    var html = "";
    var bv = report.by_variant || {};
    if (Object.keys(bv).length) {
      // 两种形态:运行阶段(by_variant 带 total_runs)/生成阶段(context-only,带 token 对照)
      var isRunShape = Object.keys(bv).some(function (k) { return bv[k] && bv[k].total_runs != null; });
      var rows = Object.keys(bv).map(function (label) {
        var v = bv[label] || {};
        if (!isRunShape) {
          return "<tr><td>" + E.esc(label) + "</td>" +
            '<td class="mono">' + E.esc(v.original_tokens != null ? v.original_tokens : "—") + "</td>" +
            '<td class="mono">' + E.esc(v.working_tokens != null ? v.working_tokens : "—") + "</td>" +
            "<td>" + (v.required_retained === false ? '<span class="null-cell">否</span>' : '<span class="cell-ok">是</span>') + "</td>" +
            "<td>" + (v.warnings || []).length + "</td></tr>";
        }
        return "<tr><td>" + E.esc(label) + "</td><td>" + (v.total_runs != null ? v.total_runs : "—") + "</td><td>" +
          (v.valid_runs != null ? v.valid_runs : "—") + "</td><td>" + (v.invalid_runs != null ? v.invalid_runs : "—") + "</td>" +
          "<td>" + E.esc((v.stop_reasons || []).join("、") || "—") + "</td></tr>";
      }).join("");
      html += isRunShape
        ? '<table class="exp-table"><tr><th>变体</th><th>运行数</th><th>有效</th><th>无效</th><th>停止原因</th></tr>' + rows + "</table>"
        : '<table class="exp-table"><tr><th>变体</th><th>压缩前 Token</th><th>压缩后 Token</th><th>强制项保留</th><th>警告</th></tr>' + rows + "</table>";
    }
    var details = report.compression_details || {};
    var names = { budgeted: "抽取式(代码)", "budgeted-llm": "生成式(LLM 摘要)" };
    Object.keys(details).forEach(function (method) {
      var d = details[method];
      var name = names[method] || method;
      var items = function (label, list) {
        if (!list || !list.length) return '<p class="note-line">' + E.esc(label) + ":无</p>";
        return '<p class="note-line"><b>' + E.esc(label) + "(" + list.length + ")</b>:" +
          list.map(function (it) { return '<span class="mono">' + E.esc(it.id) + "</span> " + E.esc(it.excerpt || ""); }).join("；") + "</p>";
      };
      html += '<details class="metric-def"><summary>压缩决策明细(' + E.esc(name) + ") · Token " +
        E.esc(d.original_tokens != null ? d.original_tokens : "—") + " → " + E.esc(d.working_tokens != null ? d.working_tokens : "—") + "</summary>" +
        items("被压缩", d.compressed_items) + items("被丢弃", d.omitted_items) +
        ((d.warnings || []).length
          ? '<p class="note-line">警告(' + d.warnings.length + "):" + E.esc(d.warnings.slice(0, 5).join("；")) + (d.warnings.length > 5 ? "…" : "") + "</p>"
          : "") +
        "</details>";
    });
    if (html) {
      document.getElementById("resultTitle").textContent = "结果 · 压缩明细(0 个 Agent 运行)";
      box.innerHTML = html + '<p class="note-line">完整工件(实际喂给模型的消息序列)经发起页「下载工件」或批次工件目录获取。</p>';
    }
  }

  function renderOwnerResult(batch) {
    var box = document.getElementById("resultBox");
    var fc = batch.fixedConditions || {};
    var runs = batch.runs || [];
    if (batch.status === "FAILED") {
      box.innerHTML = '<div class="placeholder-block">批次执行失败:执行中出错或引擎重启时被标记中断(不自动重跑/自愈);结果矩阵不生成,已落库的运行保留。请修正问题后重新发起。</div>';
      return;
    }
    if (!runs.length) {
      if (fc.context_only || batch.status === "COMPLETE") {
        // context-only 批次:0 个 Agent 运行,结果主体是作业报告里的压缩明细
        box.innerHTML = '<div class="placeholder-block">本批次无 Agent 运行(上下文生成);压缩明细见下方。</div>';
        // 报告获取两级链:内存作业(实时)→ 磁盘工件(持久,服务重启后仍在)→ 占位说明
        var fetchJobReport = ownerJobId
          ? E.get("/api/v1/jobs/" + encodeURIComponent(ownerJobId))
          : E.get("/api/v1/jobs/by-batch/" + encodeURIComponent(batch.id));
        fetchJobReport.then(function (job) {
          if (job && job.report && (job.report.compression_details || job.report.by_variant)) {
            renderOwnerReport(job.report);
          } else {
            E.get("/api/v1/batches/" + encodeURIComponent(batch.id) + "/report")
              .then(renderOwnerReport)
              .catch(function () { renderOwnerReport(null); });
          }
        }).catch(function () {
          E.get("/api/v1/batches/" + encodeURIComponent(batch.id) + "/report")
            .then(renderOwnerReport)
            .catch(function () { renderOwnerReport(null); });
        });
        return;
      }
      box.innerHTML = '<div class="placeholder-block">批次进行中:运行明细在完成后逐次落库;断开页面不影响后台执行。</div>';
      return;
    }
    document.getElementById("resultTitle").textContent = "结果 · 按受控变量分组";
    var groups = {};
    runs.forEach(function (r) {
      var mc = r.modelConfig || {};
      var key = mc.variantLabel || r.variant_id || "—";
      groups[key] = groups[key] || [];
      groups[key].push(r);
    });
    var rows = Object.keys(groups).map(function (label) {
      var list = groups[label];
      var complete = list.filter(function (r) { return r.status === "COMPLETE"; }).length;
      return "<tr><td>" + E.esc(label) + "</td><td>" + list.length + "</td><td>" + complete + "</td>" +
        "<td>" + (list.length - complete) + "</td>" +
        '<td><button type="button" class="drill" data-group="' + E.esc(label) + '">展开 ' + list.length + " 次运行</button></td></tr>";
    }).join("");
    box.innerHTML = '<table class="exp-table"><tr><th>分组</th><th>运行数</th><th>完成</th><th>无效/失败</th><th>下钻</th></tr>' + rows + "</table>" +
      '<div id="groupDrill"></div>';
    Array.prototype.forEach.call(box.querySelectorAll("[data-group]"), function (btn) {
      btn.addEventListener("click", function () { drillGroup(groups[btn.getAttribute("data-group")]); });
    });
  }

  function drillGroup(runs) {
    var box = document.getElementById("groupDrill");
    box.innerHTML = runs.map(function (r, index) {
      var mc = r.modelConfig || {};
      var repeatIndex = mc.repeatIndex != null ? mc.repeatIndex : index;
      return '<div class="run-drill"><b>' + E.esc(mc.variantLabel || r.variant_id) + " · 第" + (repeatIndex + 1) + "次</b> · " +
        E.batchStatusLabel(r.status) + " · config " + E.hashChip(mc.configHash || "") +
        (r.error_category ? ' · <span class="null-cell">' + E.esc(r.error_category) + "</span>" : "") +
        ' <button type="button" class="drill" data-run="' + E.esc(r.id) + '">单次运行明细</button>' +
        '<div class="run-detail" id="run-' + E.esc(r.id) + '" style="display:none"></div></div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-run]"), function (btn) {
      btn.addEventListener("click", function () {
        var target = document.getElementById("run-" + btn.getAttribute("data-run"));
        if (target.style.display === "block") { target.style.display = "none"; return; }
        target.style.display = "block";
        if (target.getAttribute("data-loaded")) return;
        E.get("/api/v1/runs/" + encodeURIComponent(btn.getAttribute("data-run")) + "/detail").then(function (detail) {
          target.setAttribute("data-loaded", "1");
          renderRunDetail(target, detail);
        }).catch(function (err) {
          target.innerHTML = '<div class="placeholder-block">明细读取失败:' + E.esc(err.message || "数据服务不可用") + "</div>";
        });
      });
    });
  }

  // ── 单次运行明细:摘要 + 筛选页签 + 时间线(设计 §8 三层结构) ───────────────

  var RUN_DETAIL_TABS = [["all", "全部"], ["model", "模型"], ["tool", "工具"], ["guardrail", "治理"], ["context", "上下文"]];
  var EVENT_LABELS = {
    "run.started": "运行开始",
    "context.completed": "上下文构建完成",
    "output.completed": "输出完成",
    "judgment.completed": "评判完成",
    "run.completed": "运行结束",
    "model.result_appended": "工具结果回填模型上下文"
  };

  function jsonBlock(value, label) {
    if (value == null) return "";
    var text;
    try { text = JSON.stringify(value, null, 2); } catch (e) { text = String(value); }
    return '<div class="json-wrap"><div class="json-head">' + E.esc(label || "JSON") +
      '<button type="button" class="drill copy-json">复制</button></div>' +
      '<pre class="json-block">' + E.esc(text) + "</pre></div>";
  }

  function paramStateTable(call) {
    // 参数三态(设计 §8.2):requested/sent/unsupported;不得用生效值冒充发送值
    var requested = call.requested_params || {};
    var sent = call.sent_params || {};
    var unsupported = call.unsupported_params || {};
    var keys = [];
    Object.keys(requested).concat(Object.keys(sent)).forEach(function (key) {
      if (keys.indexOf(key) < 0) keys.push(key);
    });
    if (!keys.length) return "";
    var rows = keys.map(function (key) {
      var hasSent = Object.prototype.hasOwnProperty.call(sent, key) && sent[key] !== null && sent[key] !== undefined;
      var state = hasSent ? "已发送" : (unsupported[key] ? E.esc(unsupported[key]) : "未配置/未支持");
      return '<tr><td class="mono">' + E.esc(key) + "</td><td>" +
        E.esc(requested[key] != null ? JSON.stringify(requested[key]) : "—") + "</td><td>" +
        (hasSent ? E.esc(JSON.stringify(sent[key])) : "—") + "</td><td>" + state + "</td></tr>";
    }).join("");
    return '<table class="exp-table"><tr><th>参数</th><th>请求值</th><th>实际发送</th><th>状态</th></tr>' + rows + "</table>";
  }

  function modelStep(entry) {
    var call = entry.modelCall;
    if (!call) {
      // model.requested 锚点(响应尚未产生的步骤;完成后仅保留摘要行)
      return '<div class="run-step step-event"><span class="mono">#' + E.esc(entry.sequence) + "</span> 模型请求已组装" +
        (entry.payload && entry.payload.toolSchemaHash ? " · schema " + E.esc(String(entry.payload.toolSchemaHash).slice(0, 18)) + "…" : "") + "</div>";
    }
    var failed = call.status !== "COMPLETE";
    var head = "模型调用 #" + E.esc(call.sequence) + " · " + E.esc(call.purpose || "AGENT") +
      " · " + (call.duration_ms != null ? call.duration_ms : "—") + "ms · " +
      (call.decision === "call_tool" ? "调用工具" : "最终回答") + " · " + E.esc(call.status || "");
    var body = "";
    var messages = call.messages || [];
    if (messages.length) {
      body += '<div class="msg"><b>输入消息 ' + messages.length + " 条</b>" + messages.map(function (m) {
        var content = m.content || "";
        return '<details><summary>' + E.esc(m.role) + " · " + content.length + " 字符 · " +
          E.esc(m.tokens != null ? m.tokens : "—") + " token</summary>" +
          '<pre class="json-block">' + E.esc(content) + "</pre></details>";
      }).join("") + "</div>";
    }
    var schemas = call.tool_schemas || [];
    if (schemas.length) {
      var names = schemas.map(function (s) { return (s && s.function && s.function.name) || "?"; });
      body += '<details class="msg"><summary>当轮 Tool Schema · ' + schemas.length + " 个(" +
        E.esc(names.slice(0, 4).join(", ")) + (names.length > 4 ? " …" : "") + ")</summary>" +
        jsonBlock(schemas, "tool_schemas") + "</details>";
    }
    body += paramStateTable(call);
    if (call.response_summary) body += jsonBlock(call.response_summary, "response_summary");
    if (call.request_payload) body += jsonBlock(call.request_payload, "request_payload");
    body += '<p class="note-line mono">request_hash ' + E.esc(call.request_hash || "—") +
      (call.error_category ? " · error " + E.esc(call.error_category) : "") + "</p>";
    return '<details class="run-step' + (failed ? " step-bad" : "") + '"' + (failed ? " open" : "") +
      "><summary>" + E.esc(head) + "</summary>" + body + "</details>";
  }

  function toolStep(entry) {
    var call = entry.toolCall;
    if (!call) return '<div class="run-step step-event">#' + E.esc(entry.sequence) + " 工具请求</div>";
    var bad = call.status !== "SUCCESS";
    var head = "工具 · " + E.esc(call.tool_name) + " · " + E.esc(call.status || "") +
      " · " + (call.duration_ms != null ? call.duration_ms : "—") + "ms · " +
      (call.fixture_hit ? "冻结命中" : "未命中冻结数据");
    var body = jsonBlock(call.arguments, "arguments");
    if (call.result_summary) body += jsonBlock(call.result_summary, "result_summary");
    body += '<p class="note-line mono">call_id ' + E.esc(call.call_id || "—") +
      " · audit " + E.esc(call.audit_code || "—") +
      " · 发起模型调用 #" + E.esc(call.model_call_sequence != null ? call.model_call_sequence : "—") +
      " · 事件 " + E.esc(call.requested_event_sequence != null ? call.requested_event_sequence : "—") + "→" +
      E.esc(call.completed_event_sequence != null ? call.completed_event_sequence : "—") +
      (call.error_category ? " · error " + E.esc(call.error_category) : "") + "</p>";
    return '<details class="run-step' + (bad ? " step-bad" : "") + '"' + (bad ? " open" : "") +
      "><summary>" + E.esc(head) + "</summary>" + body + "</details>";
  }

  function guardrailStep(entry) {
    var check = entry.guardrailCheck;
    if (!check) return '<div class="run-step step-event">#' + E.esc(entry.sequence) + " 治理检查</div>";
    var bad = check.decision && check.decision !== "allow";
    var head = "治理 · " + E.esc(check.stage || "") + " · " + E.esc(check.decision || "") +
      (check.audit_code ? " · " + E.esc(check.audit_code) : "") +
      (check.tool_name ? " · " + E.esc(check.tool_name) : "");
    var body = "";
    if (check.reasons && check.reasons.length) {
      body += '<p class="note-line">原因:' + check.reasons.map(E.esc).join(";") + "</p>";
    }
    body += jsonBlock({ rule_ids: check.rule_ids, detail: check.detail }, "guardrail_check");
    return '<details class="run-step' + (bad ? " step-bad" : "") + '"' + (bad ? " open" : "") +
      "><summary>" + E.esc(head) + "</summary>" + body + "</details>";
  }

  function eventStep(entry) {
    var label = EVENT_LABELS[entry.eventType] || entry.eventType;
    return '<div class="run-step step-event"><span class="mono">#' + E.esc(entry.sequence) + "</span> " + E.esc(label) + "</div>";
  }

  function renderRunDetail(target, detail) {
    var run = detail.run || detail;
    var measurements = (detail.measurements || [])[0] || {};
    var modelCalls = detail.modelCalls || [];
    var toolCalls = detail.toolCalls || [];
    var guardrails = detail.guardrailChecks || [];
    var timeline = detail.timeline;
    if (!timeline) {
      // 旧数据兜底:无 timeline 时按三类明细并列展示
      timeline = []
        .concat(modelCalls.map(function (c) { return { type: "model", modelCall: c }; }))
        .concat(toolCalls.map(function (c) { return { type: "tool", toolCall: c }; }))
        .concat(guardrails.map(function (c) { return { type: "guardrail", guardrailCheck: c }; }));
    }
    var state = { filter: "all" };

    function stepHtml(entry) {
      if (entry.type === "model") return modelStep(entry);
      if (entry.type === "tool") return toolStep(entry);
      if (entry.type === "guardrail") return guardrailStep(entry);
      return eventStep(entry);
    }

    function draw() {
      var steps = timeline.filter(function (entry) {
        if (state.filter === "all") return true;
        if (state.filter === "context") return entry.type === "event" && entry.eventType === "context.completed";
        return entry.type === state.filter;
      });
      target.innerHTML =
        '<div class="stat-mini">' +
        '<span class="m"><b>' + E.esc(run.status || "—") + "</b>状态</span>" +
        '<span class="m"><b>' + E.esc(modelCalls.length) + "</b>模型调用</span>" +
        '<span class="m"><b>' + E.esc(toolCalls.length) + "</b>工具调用</span>" +
        '<span class="m"><b>' + E.esc(guardrails.length) + "</b>治理检查</span>" +
        '<span class="m"><b>' + E.esc(measurements.total_duration_ms != null ? measurements.total_duration_ms : "—") + "</b>总耗时 ms</span>" +
        '<span class="m"><b>' + E.esc(measurements.prompt_tokens != null ? measurements.prompt_tokens : "—") + "</b>输入 Token</span>" +
        '<span class="m"><b>' + E.esc(measurements.completion_tokens != null ? measurements.completion_tokens : "—") + "</b>输出 Token</span>" +
        "</div>" +
        '<div class="detail-tabs">' + RUN_DETAIL_TABS.map(function (tab) {
          return '<button type="button" class="drill tab' + (state.filter === tab[0] ? " tab-on" : "") +
            '" data-tab="' + tab[0] + '">' + tab[1] + "</button>";
        }).join("") + "</div>" +
        '<div class="run-timeline">' +
        (steps.length ? steps.map(stepHtml).join("") : '<div class="placeholder-block">该视角暂无步骤。</div>') +
        "</div>" +
        '<p class="note-line">时间线按 run_events 全局序号交织;事件流 ' + (detail.events || []).length +
        " 条,工件 " + (detail.artifacts || []).length + " 件。</p>";
      Array.prototype.forEach.call(target.querySelectorAll("[data-tab]"), function (btn) {
        btn.addEventListener("click", function () {
          state.filter = btn.getAttribute("data-tab");
          draw();
        });
      });
      Array.prototype.forEach.call(target.querySelectorAll(".copy-json"), function (btn) {
        btn.addEventListener("click", function () {
          var wrap = btn.closest(".json-wrap");
          var pre = wrap ? wrap.querySelector("pre") : null;
          if (pre && navigator.clipboard) navigator.clipboard.writeText(pre.textContent);
          btn.textContent = "已复制";
          setTimeout(function () { btn.textContent = "复制"; }, 1200);
        });
      });
    }

    draw();
  }

  if (!batchId) { fail("缺少批次标识。"); }
  else if (E.isOwner()) {
    E.get("/api/v1/batches/" + encodeURIComponent(batchId)).then(renderOwnerView).catch(function (err) {
      if (err.status === 404 || err.status === 503) renderJobView(batchId);
      else fail("批次读取失败:" + (err.message || "服务不可达"));
    });
  } else {
    renderJobView(batchId);
  }
})();
</script>

</body>

</html>
