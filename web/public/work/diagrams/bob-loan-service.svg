  <text x="30" y="868" font-size="11" fill="#333">本系统经 统一通道 HTTP 通道调用银行能力开放平台（/manage/api/function，SM2 签名 + SM4 加密），由开放平台统一对接北京银行总行与杭州分行；度小满通道为并行直连。</text>
  <text x="30" y="890" font-size="11" fill="#7f8c8d">与数链融共用方法论：唯一流水、状态机收敛、结果补查、定时补偿、超时不重试资金操作——两套系统的资金一致性思路同源。</text>

