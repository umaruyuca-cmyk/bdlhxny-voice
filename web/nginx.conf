server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 站点静态结构(公告单页 / + about/showcase/experiment/context/judging/engine/ops 模块)
    # 旧 /docs/*、/showcase/context 与 /announce 已迁移,301 到新位置;/docs/*.css|js 资产保留原位。
    # /home(旧机甲主题页)已下线,301 回公告页。
    location = / {
        try_files /index.html =404;
    }
    location = /docs { return 301 /; }
    location = /docs/ { return 301 /; }
    location = /docs/index { return 301 /; }
    location = /docs/index.html { return 301 /; }
    location = /announce { return 301 /; }
    location = /announce/ { return 301 /; }
    location = /docs/comparison { return 301 /experiment/; }
    location = /docs/comparison.html { return 301 /experiment/; }
    location = /docs/cases { return 301 /cases/; }
    location = /docs/cases.html { return 301 /cases/; }
    location = /experiment/cases { return 301 /cases/; }
    location = /experiment/cases.html { return 301 /cases/; }
    location = /experiment/reproduce { return 301 /experiment/compression/; }
    location = /experiment/reproduce.html { return 301 /experiment/compression/; }
    location = /docs/eval { return 301 /judging/; }
    location = /docs/eval.html { return 301 /judging/; }
    location = /docs/agents { return 301 /engine/; }
    location = /docs/agents.html { return 301 /engine/; }
    location = /docs/skill { return 301 /engine/catalog; }
    location = /docs/skill.html { return 301 /engine/catalog; }
    location = /docs/tools { return 301 /engine/tools; }
    location = /docs/tools.html { return 301 /engine/tools; }
    location = /docs/results { return 301 /showcase/results; }
    location = /docs/results.html { return 301 /showcase/results; }
    location = /showcase/context { return 301 /context/results; }
    location = /showcase/context.html { return 301 /context/results; }
    location = /home { return 301 /; }
    location = /home/ { return 301 /; }
    location = /home/index { return 301 /; }
    location = /home/index.html { return 301 /; }
    # docs 目录只余静态资产(样式/脚本)
    location /docs/ {
        try_files $uri =404;
    }

    # 私有运行台(仅私有部署的镜像包含 lab/;公开镜像物理排除)
    location = /lab {
        return 302 /lab/;
    }
    location = /lab/ {
        try_files $uri $uri.html /lab/index.html =404;
    }

    # 匿名受限测试接口(实验两页的运行入口):反代到 engine 服务。
    # 只放行 /api/v1/public/*;维护者接口(/api/v1/login、eval-batches 等)不在此放行。
    # 纯静态公开部署(不含 engine)应注释掉本块——实验页提交会如实失败。
    location /api/v1/public/ {
        proxy_pass http://engine:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 模块子页带尾斜杠统一去斜杠:子页是 *.html 文件不是目录
    # (/experiment/compression/ → /experiment/compression;目录索引 /experiment/ 不受影响)
    rewrite ^(/(?:about|tools|cases|showcase|session-cross|lab|experiment|test|context|judging|engine|ops)/.+)/$ $1 permanent;

    # 模块前缀:目录索引 + 扩展名补全,未命中回模块首页
    location = /about { return 302 /about/; }
    location = /tools { return 302 /tools/; }
    location = /cases { return 302 /cases/; }
    location /tools/ {
        try_files $uri $uri.html /tools/index.html =404;
    }
    location /cases/ {
        try_files $uri $uri.html /cases/index.html =404;
    }

    location = /showcase { return 302 /showcase/; }
    location = /experiment { return 302 /experiment/; }
    location = /context { return 302 /context/; }
    location = /judging { return 302 /judging/; }
    location = /engine { return 302 /engine/; }
    location = /ops { return 302 /ops/; }
    location /about/ {
        try_files $uri $uri.html /about/index.html =404;
    }
    location /showcase/ {
        try_files $uri $uri.html /showcase/index.html =404;
    }
    location /session-cross/ {
        try_files $uri $uri.html /session-cross/index.html =404;
    }
    location /experiment/ {
        try_files $uri $uri.html /experiment/index.html =404;
    }

    location = /test { return 302 /test/; }
    location /test/ {
        try_files $uri $uri.html /test/index.html =404;
    }
    location /context/ {
        try_files $uri $uri.html /context/index.html =404;
    }
    location /judging/ {
        try_files $uri $uri.html /judging/index.html =404;
    }
    location /engine/ {
        try_files $uri $uri.html /engine/index.html =404;
    }
    location /ops/ {
        try_files $uri $uri.html /ops/index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
