server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 站点静态结构(公告 / + 五模块:实验/测试/数据资产/文档)
    # /docs/ 为「文档」模块首页(原型 v2);旧 /announce 已迁移,301 到新位置;/docs/*.css|js 资产保留原位。
    # /home(旧机甲主题页)已下线,301 回公告页。
    location = / {
        try_files /index.html =404;
    }
    location = /announce { return 301 /; }
    location = /announce/ { return 301 /; }
    location = /docs/comparison { return 301 /experiment/; }
    location = /docs/comparison.html { return 301 /experiment/; }
    location = /docs/cases { return 301 /cases/; }
    location = /docs/cases.html { return 301 /cases/; }
    location = /experiment/cases { return 301 /cases/; }
    location = /experiment/cases.html { return 301 /cases/; }
    location = /experiment/reproduce { return 301 /experiment/compression/; }
    location = /experiment/reproduce.html { return 301 /experiment/compression/; }
    location = /docs/eval { return 301 /judging/; }
    location = /docs/eval.html { return 301 /judging/; }
    location = /docs/agents { return 301 /engine/; }
    location = /docs/agents.html { return 301 /engine/; }
    location = /docs/skill { return 301 /engine/catalog; }
    location = /docs/skill.html { return 301 /engine/catalog; }
    location = /docs/tools { return 301 /engine/catalog; }
    location = /docs/tools.html { return 301 /engine/catalog; }
    location = /docs/results { return 301 /showcase/results; }
    location = /docs/results.html { return 301 /showcase/results; }
    location = /showcase/context { return 301 /context/results; }
    location = /showcase/context.html { return 301 /context/results; }
    location = /engine/loading { return 301 /engine/; }
    location = /engine/loading.html { return 301 /engine/; }
    location = /engine/tools { return 301 /engine/catalog; }
    location = /engine/tools.html { return 301 /engine/catalog; }
    location = /engine/guardrail { return 301 /engine/governance; }
    location = /engine/guardrail.html { return 301 /engine/governance; }
    location = /judging/metrics { return 301 /judging/; }
    location = /judging/metrics.html { return 301 /judging/; }
    location = /ops/deploy { return 301 /ops/; }
    location = /ops/deploy.html { return 301 /ops/; }
    location = /experiment/batches { return 301 /test/; }
    location = /experiment/batches.html { return 301 /test/; }
    location = /home { return 301 /; }
    location = /home/ { return 301 /; }
    location = /home/index { return 301 /; }
    location = /home/index.html { return 301 /; }
    # 旧实验/交叉模块入口 → 模板中心与上下文结果
    location = /experiment/comparison { return 301 /experiment/; }
    location = /experiment/comparison.html { return 301 /experiment/; }
    location = /session-cross { return 301 /context/results; }
    location = /session-cross/index { return 301 /context/results; }
    location = /session-cross/inputs { return 301 /context/library; }
    location = /session-cross/results { return 301 /context/results; }
    location /session-cross/ { return 301 /context/results; }
    # docs 目录:文档模块首页 + 静态资产(样式/脚本)
    location /docs/ {
        try_files $uri $uri.html /docs/index.html =404;
    }

    # 数据资产模块首页(用例库/工具目录/长上下文库三入口)
    location = /assets {
        return 302 /assets/;
    }
    location /assets/ {
        try_files $uri $uri.html /assets/index.html =404;
    }

    # 旧运行台入口 → 实验中心(功能已并入实验模块)
    location = /lab { return 301 /experiment/; }
    location = /lab/index { return 301 /experiment/; }
    location /lab/ { return 301 /experiment/; }

    # 匿名受限测试接口(实验页的运行入口):反代到 engine 服务。
    # /api/v1/public/* 对所有部署放行;维护者专属发起接口(template-batches、
    # context-batches、llm-config 等)不在此放行(lab 走 engine 直连+CORS)。
    # 纯静态公开部署(不含 engine)应注释掉本块——实验页提交会如实失败。
    location /api/v1/public/ {
        proxy_pass http://engine:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 实验页所有者通道(同源,前后端对接契约 §2):登录会话、模板清单、
    # plan 预估、模板批次(压缩对照兼容)、实验组/单次运行、批次/运行读取与作业进度。
    # 私有部署有效;公开镜像不含 engine 时上游不可达(502),页面按匿名视图工作。
    location ~ ^/api/v1/(login|logout|llm-config/test|experiment-templates|template-batches|experiment-series|statistics|batches|jobs|runs) {
        proxy_pass http://engine:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 批次详情 /experiment/batch/<id>:静态站无服务端路由,
    # 统一落到 batch.html,由页面解析 pathname 中的批次标识。
    location ~ ^/experiment/batch/ {
        try_files /experiment/batch.html =404;
    }

    # 实验组详情 /experiment/series/<id>:同上,落到 series.html
    # (样本积累 + 统计快照 + 逐样本追加,方案 13.11)。
    location ~ ^/experiment/series/ {
        try_files /experiment/series.html =404;
    }

    # 模块子页带尾斜杠统一去斜杠:子页是 *.html 文件不是目录
    # (/experiment/compression/ → /experiment/compression;目录索引 /experiment/ 不受影响)
    rewrite ^(/(?:about|tools|cases|showcase|lab|experiment|test|context|judging|engine|ops|assets|docs)/.+)/$ $1 permanent;

    # 模块前缀:目录索引 + 扩展名补全,未命中回模块首页
    location = /about { return 302 /about/; }
    location = /tools { return 302 /tools/; }
    location = /cases { return 302 /cases/; }
    location = /docs { return 302 /docs/; }
    location /tools/ {
        try_files $uri $uri.html /tools/index.html =404;
    }
    location /cases/ {
        try_files $uri $uri.html /cases/index.html =404;
    }

    location = /showcase { return 302 /showcase/; }
    location = /experiment { return 302 /experiment/; }
    location = /context { return 302 /context/; }
    location = /judging { return 302 /judging/; }
    location = /engine { return 302 /engine/; }
    location = /ops { return 302 /ops/; }
    location /about/ {
        try_files $uri $uri.html /about/index.html =404;
    }
    location /showcase/ {
        try_files $uri $uri.html /showcase/index.html =404;
    }
    location /experiment/ {
        try_files $uri $uri.html /experiment/index.html =404;
    }

    location = /test { return 302 /test/; }
    location /test/ {
        try_files $uri $uri.html /test/index.html =404;
    }
    location /context/ {
        try_files $uri $uri.html /context/index.html =404;
    }
    location /judging/ {
        try_files $uri $uri.html /judging/index.html =404;
    }
    location /engine/ {
        try_files $uri $uri.html /engine/index.html =404;
    }
    location /ops/ {
        try_files $uri $uri.html /ops/index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
