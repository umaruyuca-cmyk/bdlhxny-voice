server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 站点结构(信息架构 v3:实验结果与原始证据优先):
    # 首页为代表项目(职业实践门户);内容页 /overview/ /results/ /evidence/ /system/ /methodology/ + 静态资产(/docs/*.css|js、/showcase-data/、/work/diagrams/)。
    # 本站为纯静态展示:无登录、无运行入口、无后端反代(公开镜像不含任何私有 API 通道)。
    # 旧模块地址全部 301 到内容唯一归属的新页(与 scripts/redirect-map.mjs 同一映射)。

    location = / {
        try_files /index.html =404;
    }

    # ── 页面模块 ──────────────────────────────────────────────────────────
    location = /results { return 302 /results/; }
    location /results/ {
        try_files $uri $uri.html /results/index.html =404;
    }
    location = /evidence { return 302 /evidence/; }
    location /evidence/ {
        try_files $uri $uri.html /evidence/index.html =404;
    }
    # 单次运行证据链 /evidence/run/?id=<run_id>:静态站无服务端路由,
    # 统一落到 run.html,由页面解析查询参数
    location ~ ^/evidence/run/ {
        try_files /evidence/run.html =404;
    }
    location = /system { return 302 /system/; }
    location /system/ {
        try_files $uri $uri.html /system/index.html =404;
    }
    location = /methodology { return 302 /methodology/; }
    location /methodology/ {
        try_files $uri $uri.html /methodology/index.html =404;
    }
    location = /overview { return 302 /overview/; }
    location /overview/ {
        try_files $uri $uri.html /overview/index.html =404;
    }
    # 工作项目页已升为首页:/work 与 /work/ 301 到 /;/work/diagrams/ 脱敏图作为静态资产保留
    location = /work { return 301 /; }
    location = /work/ { return 301 /; }
    location /work/diagrams/ {
        try_files $uri =404;
    }

    # ── 旧地址 301(与 redirect-map.mjs 同步) ─────────────────────────────
    location = /announce { return 301 /; }
    location = /home { return 301 /; }
    location = /home/ { return 301 /; }
    location = /home/index { return 301 /; }
    location = /about { return 301 /; }
    location = /about/ { return 301 /; }
    location = /about/banks { return 301 /methodology/; }
    location = /about/repo { return 301 /system/; }
    location = /showcase { return 301 /results/; }
    location = /showcase/ { return 301 /results/; }
    location = /showcase/results { return 301 /results/; }
    location = /showcase/runs { return 301 /evidence/; }
    location = /showcase/tools { return 301 /evidence/; }
    location = /showcase/context { return 301 /results/; }
    location = /experiment { return 301 /methodology/; }
    location = /experiment/ { return 301 /methodology/; }
    location = /experiment/comparison { return 301 /methodology/; }
    location = /experiment/cases { return 301 /methodology/; }
    location = /experiment/compression { return 301 /methodology/strategy-comparison.html; }
    location = /experiment/reproduce { return 301 /methodology/; }
    location = /experiment/run { return 301 /methodology/; }
    location = /experiment/series { return 301 /methodology/; }
    location = /experiment/batches { return 301 /evidence/; }
    location = /experiment/batch { return 301 /evidence/; }
    location ~ ^/experiment/batch/ { return 301 /evidence/; }
    location ~ ^/experiment/series/ { return 301 /methodology/; }
    location = /experiment/context-workbench { return 301 /system/context-demo.html; }
    location = /experiment/context-build { return 301 /system/context-demo.html; }
    location ~ ^/experiment/context-builds/ { return 301 /system/; }
    location = /test { return 301 /evidence/; }
    location = /test/ { return 301 /evidence/; }
    location = /context { return 301 /system/; }
    location = /context/ { return 301 /system/; }
    location = /context/library { return 301 /methodology/strategy-comparison.html; }
    location = /context/design { return 301 /methodology/; }
    location = /context/results { return 301 /results/; }
    location = /judging { return 301 /methodology/; }
    location = /judging/ { return 301 /methodology/; }
    location = /judging/metrics { return 301 /methodology/; }
    location = /judging/judge { return 301 /methodology/; }
    location = /judging/invalid { return 301 /methodology/; }
    location = /engine { return 301 /system/; }
    location = /engine/ { return 301 /system/; }
    location = /engine/catalog { return 301 /system/; }
    location = /engine/governance { return 301 /system/; }
    location = /engine/guardrail { return 301 /system/; }
    location = /engine/loading { return 301 /system/; }
    location = /engine/tools { return 301 /system/; }
    location = /ops { return 301 /system/; }
    location = /ops/ { return 301 /system/; }
    location = /ops/run-api { return 301 /system/; }
    location = /ops/artifacts { return 301 /system/; }
    location = /ops/deploy { return 301 /system/; }
    location = /ops/roadmap { return 301 /system/; }
    location = /tools { return 301 /system/; }
    location = /tools/ { return 301 /system/; }
    location = /tools/detail { return 301 /system/; }
    location = /cases { return 301 /methodology/; }
    location = /cases/ { return 301 /methodology/; }
    location = /cases/detail { return 301 /methodology/; }
    location = /assets { return 301 /methodology/; }
    location = /assets/ { return 301 /methodology/; }
    location = /docs { return 301 /system/; }
    location = /docs/ { return 301 /system/; }
    location = /docs/comparison { return 301 /methodology/; }
    location = /docs/cases { return 301 /methodology/; }
    location = /docs/eval { return 301 /methodology/; }
    location = /docs/agents { return 301 /system/; }
    location = /docs/skill { return 301 /system/; }
    location = /docs/tools { return 301 /system/; }
    location = /docs/results { return 301 /results/; }
    location = /lab { return 301 /system/; }
    location = /lab/ { return 301 /system/; }
    location = /session-cross { return 301 /methodology/; }
    location = /session-cross/inputs { return 301 /methodology/; }
    location = /session-cross/results { return 301 /results/; }
    location ~ ^/session-cross/ { return 301 /methodology/; }

    # docs 目录:仅静态资产(全站样式/脚本);目录索引已并入执行逻辑页
    location /docs/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
