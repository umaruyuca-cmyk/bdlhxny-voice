spring:
  # 外置敏感YAML不会进入JAR；本地或云端只需把文件放到启动目录的config子目录。
  # 当前已停用外置YAML自动导入，环境差异统一放在dev或prod配置中。
  profiles:
    active: dev
  application:
    name: stockwise-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ─── MyBatis-Plus ───
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.stockwise.handler
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  url: /v3/api-docs
  path: /docs
  page-title: StockWise API 文档
  theme: purple
  layout: modern
  show-sidebar: true
  hide-models: false
  hide-test-request-button: false
  dark-mode: false

stockwise:
  ai:
    # 普通问答与旧意图分类默认统一使用DeepSeek，可切换为ollama。
    chat-provider: ${STOCKWISE_CHAT_PROVIDER:deepseek}
  embedding:
    # text-embedding-v4默认输出1024维，与现有pgvector字段保持一致。
    provider: ${STOCKWISE_EMBEDDING_PROVIDER:dashscope}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${STOCKWISE_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${STOCKWISE_EMBEDDING_DIMENSIONS:1024}
  routing:
    semantic:
      # 默认关闭付费语义路由；规则未命中时使用本地 Intent 兜底，显式开启才调用 DeepSeek 候选分类。
      enabled: ${DEEPSEEK_ROUTER_ENABLED:false}
      model: ${DEEPSEEK_ROUTER_MODEL:deepseek-v4-flash}
      max-output-tokens: ${DEEPSEEK_ROUTER_MAX_TOKENS:256}
      total-timeout-ms: ${DEEPSEEK_ROUTER_TIMEOUT_MS:2500}
      max-concurrent-calls: ${DEEPSEEK_ROUTER_MAX_CONCURRENCY:8}
  single-user:
    # 当前产品为单用户部署，客户端不得自行提交userId
    id: ${STOCKWISE_SINGLE_USER_ID:1}
  jwt:
    # 生产环境必须通过环境变量覆盖默认密钥
    secret: ${JWT_SECRET:}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  legacy-stock-agent:
    # 旧版直连Skill/DeepSeek入口默认关闭，正式页面只走AgentOrchestrator
    enabled: ${LEGACY_STOCK_AGENT_ENABLED:false}
  legacy-agent-runtime:
    # 新的 Agent 主流程由 Python LangGraph 承载；仅迁移回滚时显式开启旧 Java 入口。
    enabled: ${LEGACY_JAVA_AGENT_RUNTIME_ENABLED:false}
  java-data:
    # 生产环境必须设为 true，并由 Python 传递有效用户 JWT；开发环境可回退单用户身份。
    require-authenticated: ${JAVA_DATA_REQUIRE_AUTHENTICATED:false}
    # Python -> Java 的服务间凭证；不得与用户 JWT 或外部 API Key 共用。
    internal-token: ${JAVA_DATA_INTERNAL_TOKEN:}
  execution:
    agent:
      core-threads: ${AGENT_CORE_THREADS:4}
      max-threads: ${AGENT_MAX_THREADS:16}
      queue-capacity: ${AGENT_QUEUE_CAPACITY:100}
    react-tool:
      core-threads: ${REACT_TOOL_CORE_THREADS:4}
      max-threads: ${REACT_TOOL_MAX_THREADS:8}
      queue-capacity: ${REACT_TOOL_QUEUE_CAPACITY:64}
  react:
    # ReAct 只执行初始 Route 允许的 Action，Skill 可在不超过全局边界时收紧预算
    max-steps: ${REACT_MAX_STEPS:5}
    deadline-ms: ${REACT_DEADLINE_MS:180000}
    tool-timeout-ms: ${REACT_TOOL_TIMEOUT_MS:60000}
    max-same-action: ${REACT_MAX_SAME_ACTION:1}
    max-observation-chars: ${REACT_MAX_OBSERVATION_CHARS:8000}
  context-window:
    # LangChain4j 只生成本轮上下文视图，工作记忆仍以 Redis CAS 状态为唯一真相源
    max-messages: ${CONTEXT_MAX_MESSAGES:10}
    local-max-memory-tokens: ${CONTEXT_LOCAL_MAX_MEMORY_TOKENS:2000}
    paid-max-memory-tokens: ${CONTEXT_PAID_MAX_MEMORY_TOKENS:4000}
    max-message-tokens: ${CONTEXT_MAX_MESSAGE_TOKENS:800}
    max-summaries: ${CONTEXT_MAX_SUMMARIES:3}
    max-summary-tokens: ${CONTEXT_MAX_SUMMARY_TOKENS:900}
  memory:
    episodic-vector:
      # 完整会话仍归档到conversation_history；本配置只控制可重建的LangChain4j摘要向量索引
      enabled: ${EPISODIC_MEMORY_ENABLED:true}
      top-k: ${EPISODIC_MEMORY_TOP_K:3}
      min-similarity: ${EPISODIC_MEMORY_MIN_SIMILARITY:0.55}
      candidate-multiplier: ${EPISODIC_MEMORY_CANDIDATE_MULTIPLIER:4}
      semantic-weight: ${EPISODIC_MEMORY_SEMANTIC_WEIGHT:0.85}
      recency-weight: ${EPISODIC_MEMORY_RECENCY_WEIGHT:0.15}
      recency-half-life-days: ${EPISODIC_MEMORY_RECENCY_HALF_LIFE_DAYS:30}
      recent-fallback-limit: ${EPISODIC_MEMORY_RECENT_FALLBACK_LIMIT:3}
  vector:
    dimension: 1024
  knowledge:
    min-similarity: 0.55
  stock-analysis:
    # Java 仅通过独立 Node.js stock-wrapper 调用，不读取本机 Skill 路径
    base-url: ${STOCK_WRAPPER_URL:http://localhost:3001}
    internal-token: ${STOCK_WRAPPER_TOKEN:}
    connect-timeout-ms: ${STOCK_WRAPPER_CONNECT_TIMEOUT_MS:3000}
    request-timeout-ms: ${STOCK_WRAPPER_REQUEST_TIMEOUT_MS:120000}
  web-search:
    # 通过环境变量选择云端或本地 Wrapper，不直接解析 SearXNG 原始响应
    endpoint-url: ${WEB_SEARCH_ENDPOINT_URL:http://localhost:3002/api/search}
    agent-id: ${WEB_SEARCH_AGENT_ID:stockwise}
    agent-token: ${WEB_SEARCH_AGENT_TOKEN:}
    connect-timeout-ms: ${WEB_SEARCH_CONNECT_TIMEOUT_MS:3000}
    request-timeout-ms: ${WEB_SEARCH_REQUEST_TIMEOUT_MS:15000}
