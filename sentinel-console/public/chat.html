<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>会话 · Sentinel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/chat-theme.css">
</head>
<body>
<div class="app">

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="/" title="返回首页">
        <span class="brand-mark">Sentinel</span>
        <span class="brand-sub">会话</span>
      </a>
      <button class="icon-btn" id="sidebarCollapse" type="button" aria-label="收起历史记录" aria-controls="sidebar" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <button class="new-chat" id="newChat" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新对话
    </button>

    <div class="nav-block">
      <div class="nav-block-label">入口</div>
      <a class="nav-item" href="/dashboard" id="navDashboard">
        <span class="nav-ico" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
        </span>
        <span class="nav-txt">看护首页</span>
      </a>
      <button class="nav-item" id="navProfile" type="button">
        <span class="nav-ico" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
        </span>
        <span class="nav-txt">金融资料</span>
      </button>
    </div>

    <div class="sessions-panel">
      <div class="sessions-label">聊天</div>
      <div class="sessions" id="sessionList"></div>
    </div>

    <div class="sidebar-foot">
      <button class="account-chip foot-account" id="accountButton" type="button">登录</button>
      <a class="foot-link" href="/">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
        返回首页
      </a>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <main class="main">
    <!-- 对话视图 -->
    <section class="view on is-empty" id="viewChat">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" type="button" aria-label="菜单">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span class="topbar-title" id="chatTitle">新的对话</span>
        <span class="followup-chip" id="followupChip" hidden></span>
        <span class="topbar-model">Sentinel</span>
      </header>

      <div class="chat-stage" id="chatStage">
        <div class="scroll" id="scroll">
          <div class="hero" id="hero">
            <h1>追问看护，或直接提问。</h1>
            <p>会话通道与看护环共用同一 Agent。工具由治理中间件装载，无需启用「插件」。</p>
            <div class="skill-row" id="heroSkills">
              <button class="skill-chip suggest" type="button" data-q="对我的换房计划有影响吗">换房计划影响</button>
              <button class="skill-chip suggest" type="button" data-q="对该标的做深度研究">深度研究</button>
              <button class="skill-chip suggest" type="button" data-q="我适合买吗">适合度筛查</button>
            </div>
          </div>

          <div class="messages" id="messages"></div>
        </div>

        <div class="composer-wrap">
          <div class="degrade-bar" id="degradeBar" hidden></div>
          <div class="run-controls" id="runControls" hidden>
            <button type="button" class="run-btn" id="pauseBtn">⏸ 暂停</button>
            <button type="button" class="run-btn" id="resumeBtn" hidden>▶ 恢复</button>
          </div>
          <div class="clarify-tray" id="clarifyTray" hidden></div>
          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="有问题，尽管问…" autofocus></textarea>
            <div class="composer-bar">
              <span class="composer-tip">Enter 发送 · Esc 停止并回填 · Shift + Enter 换行</span>
              <button class="send" id="sendBtn" type="submit" aria-label="发送">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </form>
          <div class="foot-note">由 Sentinel 编排生成，仅供参考 · 不构成投资建议</div>
        </div>
      </div>

      <button class="to-bottom" id="toBottom" type="button" aria-label="回到底部">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
    </section>
  </main>
</div>

<div class="auth-overlay" id="authModal" hidden>
  <section class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <h2 id="authTitle">登录 Sentinel</h2>
    <div id="authLoginPanel">
      <p id="authHint">登录后，对话、记忆和个人资料将按账号独立保存。</p>
      <label for="authUsername">用户名</label>
      <input id="authUsername" autocomplete="username" placeholder="输入用户名">
      <label for="authPassword">密码</label>
      <input id="authPassword" type="password" autocomplete="current-password" placeholder="至少 8 位密码">
      <p class="auth-error" id="authError"></p>
      <div class="auth-actions">
        <button class="auth-primary" id="authLogin" type="button">登录</button>
        <button id="authRegister" type="button">注册账号</button>
      </div>
    </div>
  </section>
</div>

<div class="auth-overlay" id="profileModal" hidden>
  <section class="auth-modal profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <h2 id="profileTitle">确认金融资料</h2>
    <p class="profile-hint">写入服务端受控确认后，才能做「适不适合我」的真实性匹配。不会伪装成 LIVE 券商同步。</p>
    <form id="profileForm">
      <input type="hidden" id="profileVersion" value="0">
      <div class="profile-grid">
        <label>风险承受
          <select id="profileRisk" required>
            <option value="conservative">保守</option>
            <option value="moderate">稳健</option>
            <option value="balanced" selected>平衡</option>
            <option value="aggressive">积极</option>
          </select>
        </label>
        <label>最大可承受亏损 %
          <input id="profileMaxLoss" type="number" min="0" max="100" step="1" value="20" required>
        </label>
        <label>币种
          <input id="profileCurrency" value="CNY" maxlength="8" required>
        </label>
        <label>现金
          <input id="profileCash" type="number" min="0" step="0.01" value="10000" required>
        </label>
        <label>流动资产
          <input id="profileLiquid" type="number" min="0" step="0.01" value="50000" required>
        </label>
        <label>近期现金需求
          <input id="profileCashNeeds" type="number" min="0" step="0.01" value="5000" required>
        </label>
        <label>现金需求天数
          <input id="profileHorizon" type="number" min="1" step="1" value="90" required>
        </label>
      </div>
      <fieldset class="profile-positions">
        <legend>可选持仓（留空则仅确认风险/账户）</legend>
        <div class="profile-grid">
          <label>代码 <input id="posSymbol" placeholder="600519" maxlength="16"></label>
          <label>名称 <input id="posName" placeholder="贵州茅台" maxlength="64"></label>
          <label>数量 <input id="posQty" type="number" min="0" step="0.01"></label>
          <label>成本价 <input id="posCost" type="number" min="0" step="0.01"></label>
          <label>交易所
            <select id="posExchange">
              <option value="SSE">SSE</option>
              <option value="SZSE">SZSE</option>
            </select>
          </label>
          <label>目标权重(0-1) <input id="posWeight" type="number" min="0" max="1" step="0.01" value="0.1"></label>
        </div>
      </fieldset>
      <p class="auth-error" id="profileError"></p>
      <div class="auth-actions">
        <button class="auth-primary" id="profileSave" type="submit">确认并继续评估</button>
        <button id="profileCancel" type="button">取消</button>
      </div>
    </form>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="assets/badges.js"></script>
<script src="assets/blocks.js"></script>
<script src="assets/chat.js"></script>
</body>
</html>
