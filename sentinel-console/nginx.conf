server {
    # 云端使用 host 网络，仅允许同机边缘 Nginx 访问。
    listen 127.0.0.1:8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 品牌落地页；看护首页（P1）仅 /dashboard
    location = / {
        try_files /index.html =404;
    }
    location = /dashboard {
        try_files /dashboard.html =404;
    }
    location = /dashboard/ {
        try_files /dashboard.html =404;
    }

    # 新版统一助手入口。旧 /workspace 永久重定向到 /agent。
    location = /workspace {
        return 301 /agent;
    }
    location = /workspace/ {
        return 301 /agent;
    }
    location = /agent {
        try_files /chat.html =404;
    }
    location = /agent/ {
        try_files /chat.html =404;
    }
    location ^~ /agent/ {
        try_files /chat.html =404;
    }

    # 公共文档页面（/docs 索引 + /docs/skill|agents）
    location = /docs {
        return 302 /docs/index.html;
    }
    location = /docs/ {
        try_files /docs/index.html =404;
    }
    location /docs/ {
        try_files $uri $uri.html /docs/index.html =404;
    }

    # Skills 试用页（/skills/）；/skills/registry.json 等静态文件仍走 try_files
    location = /skills {
        return 302 /skills/;
    }
    location = /skills/ {
        try_files /skills/index.html =404;
    }
    location /skills/ {
        try_files $uri $uri.html /skills/index.html =404;
    }

    # Python LangGraph：统一聊天入口和它自己的会话目录。
    location ^~ /api/v1/chat/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location ^~ /api/v1/conversations {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Python：Run Pause / Cancel（ADR-014），不得落到 Java。
    location ^~ /api/v1/agent-runs {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location ^~ /api/v1/notifications {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location ^~ /api/v1/watch-rules {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location = /api/v1/ready {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Java：认证、账号、持仓和其他确定性业务 API。
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /actuator/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
