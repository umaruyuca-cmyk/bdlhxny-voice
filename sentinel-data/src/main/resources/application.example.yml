# 仓库内唯一 Java 配置模板。
# 本地：复制为同目录 application.yml 后按本机填写（端口、库地址、密钥）。
# application.yml 不入库。Docker 构建会用本文件打进 jar，连接信息用环境变量覆盖。

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bdlh-runtime-data
  datasource:
    dynamic:
      primary: pg
      strict: false
      lazy: true
      hikari:
        minimum-idle: ${BDLH_DB_MIN_IDLE:1}
        maximum-pool-size: ${BDLH_DB_MAX_POOL_SIZE:8}
        connection-timeout: ${BDLH_DB_CONNECTION_TIMEOUT_MS:3000}
        validation-timeout: ${BDLH_DB_VALIDATION_TIMEOUT_MS:1000}
        leak-detection-threshold: ${BDLH_DB_LEAK_DETECTION_THRESHOLD_MS:0}
      datasource:
        pg:
          url: ${PG_URL:}
          username: ${PG_USER:}
          password: ${PG_PASSWORD:}
          driver-class-name: org.postgresql.Driver
        mysql:
          url: ${MYSQL_URL:}
          username: ${MYSQL_USER:}
          password: ${MYSQL_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ─── MyBatis-Plus ───
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.bdlh.runtime.handler
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  url: /v3/api-docs
  path: /docs
  page-title: BDLH Agent Runtime API 文档
  theme: purple
  layout: modern
  show-sidebar: true
  hide-models: false
  hide-test-request-button: false
  dark-mode: false

bdlh_runtime:
  single-user:
    # 当前产品为单用户部署，客户端不得自行提交userId
    id: ${BDLH_RUNTIME_SINGLE_USER_ID:1}
  jwt:
    # 生产环境必须通过环境变量覆盖默认密钥
    secret: ${JWT_SECRET:}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  java-data:
    # 生产必须设为 true，并由 Python 传递有效用户 JWT；本地可回退单用户身份。
    require-authenticated: ${JAVA_DATA_REQUIRE_AUTHENTICATED:false}
    # Python -> Java 的服务间凭证；不得与用户 JWT 或外部 API Key 共用。
    internal-token: ${JAVA_DATA_INTERNAL_TOKEN:}
  rocketmq:
    # P4 默认关闭，只有单节点 Broker/Proxy 与 Topic 初始化完成后才开启。
    enabled: ${ROCKETMQ_ENABLED:false}
    endpoints: ${ROCKETMQ_ENDPOINTS:rmq-broker:8081}
    relay-fixed-delay-ms: ${ROCKETMQ_RELAY_FIXED_DELAY_MS:1000}
    relay-batch-size: ${ROCKETMQ_RELAY_BATCH_SIZE:50}
