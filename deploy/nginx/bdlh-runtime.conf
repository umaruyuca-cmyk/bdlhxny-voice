# BDLH Agent Runtime 公网边缘 Nginx 配置
#
# 启用前请先为以下域名创建 DNS 记录并申请同一张证书：
# - bdlhxny.com
# - www.bdlhxny.com
# - akshare-mcp.bdlhxny.com
# - cn-financial-mcp.bdlhxny.com
#
# 证书路径以 Certbot 默认目录为例，如实际证书名称不同请同步修改。

server {
    listen 80;
    listen [::]:80;
    server_name
        bdlhxny.com
        www.bdlhxny.com
        akshare-mcp.bdlhxny.com
        cn-financial-mcp.bdlhxny.com;

    return 301 https://$host$request_uri;
}

server {
    # 兼容当前服务器 Nginx 1.24。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bdlhxny.com www.bdlhxny.com;

    ssl_certificate /etc/letsencrypt/live/bdlhxny.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bdlhxny.com/privkey.pem;

    server_tokens off;
    client_max_body_size 10m;

    # 必须放在通用 /api/v1/ 和 / 之前，避免搜索请求落到错误上游。
    location = /api/search {
        proxy_pass http://127.0.0.1:3002/api/search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Agent-Id $http_x_agent_id;
        proxy_set_header X-Search-Token $http_x_search_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Python LangGraph 聊天入口。SSE 必须关闭代理缓冲。
    location ^~ /api/v1/chat/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # 新版聊天会话与 Graph thread 同属 Python 服务。
    location ^~ /api/v1/conversations {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Java Backend：认证、账号和确定性用户领域 API。
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /actuator/ {
        return 404;
    }

    # 最新前端容器。/agent、/docs 等页面由容器内 Nginx 处理。
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Streamable HTTP MCP。独立子域名可保持上游 /mcp 路径不变。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akshare-mcp.bdlhxny.com;

    ssl_certificate /etc/letsencrypt/live/bdlhxny.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bdlhxny.com/privkey.pem;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 旧版 SSE MCP 会返回 /messages/ 回调路径，使用独立子域名可原样转发。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cn-financial-mcp.bdlhxny.com;

    ssl_certificate /etc/letsencrypt/live/bdlhxny.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bdlhxny.com/privkey.pem;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }
}
