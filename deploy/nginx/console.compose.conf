# Compose 桥接网络专用：覆盖 sentinel-console 镜像内 nginx.conf。
# 监听容器 8082，反代编排器 / 数据面服务名（勿用于 host 网络云端前端）。
server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 公开展示面收敛为 /docs/ 文档页
    location = / {
        try_files /docs/index.html =404;
    }
    location = /dashboard {
        try_files /dashboard.html =404;
    }
    location = /dashboard/ {
        try_files /dashboard.html =404;
    }
    location = /lab {
        try_files /lab.html =404;
    }
    location = /lab/ {
        try_files /lab.html =404;
    }

    location = /workspace {
        return 301 /lab;
    }
    location = /workspace/ {
        return 301 /lab;
    }
    location = /agent {
        return 301 /lab;
    }
    location = /agent/ {
        return 301 /lab;
    }
    location ^~ /agent/ {
        return 301 /lab;
    }

    location = /docs {
        return 302 /docs/index.html;
    }
    location = /docs/ {
        try_files /docs/index.html =404;
    }
    location /docs/ {
        try_files $uri $uri.html /docs/index.html =404;
    }

    location = /skills {
        return 302 /skills/;
    }
    location = /skills/ {
        try_files /skills/index.html =404;
    }
    location /skills/ {
        try_files $uri $uri.html /skills/index.html =404;
    }

    location ^~ /api/v1/chat/ {
        proxy_pass http://bdlh-runtime-orchestrator:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location ^~ /api/v1/conversations {
        proxy_pass http://bdlh-runtime-orchestrator:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ^~ /api/v1/agent-runs {
        proxy_pass http://bdlh-runtime-orchestrator:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location ^~ /api/v1/notifications {
        proxy_pass http://bdlh-runtime-orchestrator:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location ^~ /api/v1/watch-rules {
        proxy_pass http://bdlh-runtime-orchestrator:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location = /api/v1/ready {
        proxy_pass http://bdlh-runtime-orchestrator:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://bdlh-runtime-data:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /actuator/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
