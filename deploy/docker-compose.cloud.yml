name: touchstone-cloud

services:
  data:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/data:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATA_INTERNAL_TOKEN: ${DATA_INTERNAL_TOKEN:?DATA_INTERNAL_TOKEN is required}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  engine:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/engine:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATA_API_BASE_URL: http://data:8080/internal/v1
      DATA_INTERNAL_TOKEN: ${DATA_INTERNAL_TOKEN:?DATA_INTERNAL_TOKEN is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7-flash}
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
      ARTIFACTS_DIR: /app/artifacts
      MAX_CONCURRENT_BATCHES: ${MAX_CONCURRENT_BATCHES:-1}
      CONTEXT_MEMORY_MODE: ${CONTEXT_MEMORY_MODE:-legacy}
      CONTEXT_BUILD_STORE: ${CONTEXT_BUILD_STORE:-file}
      RUN_API_ALLOWED_ORIGINS: ${RUN_API_ALLOWED_ORIGINS:-}
    depends_on:
      data:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8090}:8090"
    volumes:
      - touchstone-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # 明文 HTTP：公网流量必须在网关/负载均衡终止 TLS 后转发到本端口（见 deploy/README.md 云环境）
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8082/docs/"]
      interval: 10s
      timeout: 3s
      retries: 8

volumes:
  touchstone-artifacts:
