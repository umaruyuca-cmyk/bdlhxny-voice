# ============================================================
# StockWise Java Backend 云端部署
# 既有 PG/MySQL/Redis/Ollama/Wrapper 均运行在同一 Linux 服务器。
# 使用 host 网络访问回环地址，避免开放基础设施端口或绕公网 IP。
# ============================================================

services:
  stockwise-backend:
    build:
      context: ../stockwise-backend
      dockerfile: Dockerfile
    container_name: stockwise-backend
    restart: unless-stopped
    network_mode: host
    environment:
      # 云端只需选择prod，全部连接信息都由application-prod.yml提供。
      SPRING_PROFILES_ACTIVE: prod
