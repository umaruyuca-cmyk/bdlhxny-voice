# ============================================================
# BDLH Agent Runtime Java Backend 云端部署
# 既有 PG/MySQL/Redis/Ollama/Wrapper 均运行在同一 Linux 服务器。
# 使用 host 网络访问回环地址，避免开放基础设施端口或绕公网 IP。
# ============================================================

services:
  bdlh-runtime-orchestrator:
    build:
      context: ../bdlh-runtime-orchestrator
      dockerfile: Dockerfile
    container_name: bdlh-runtime-orchestrator
    restart: unless-stopped
    network_mode: host
    command: ["uvicorn", "bdlh_runtime.main:app", "--host", "127.0.0.1", "--port", "8090"]
    environment:
      BDLH_RUNTIME_ENV: production
      BDLH_RUNTIME_CHECKPOINTER_BACKEND: postgres
      BDLH_RUNTIME_AUTH_REQUIRED: "true"
      POSTGRES_DSN: ${POSTGRES_DSN}
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      JAVA_API_BASE_URL: http://127.0.0.1:8081
      JAVA_DATA_INTERNAL_TOKEN: ${JAVA_DATA_INTERNAL_TOKEN}
      AKSHARE_ONE_MCP_ENDPOINT: ${AKSHARE_ONE_MCP_ENDPOINT:-https://akshare-mcp.bdlhxny.com/mcp}
      CN_FINANCIAL_MCP_ENDPOINT: ${CN_FINANCIAL_MCP_ENDPOINT:-https://cn-financial-mcp.bdlhxny.com/sse}
      WEB_SEARCH_BASE_URL: http://127.0.0.1:3002
      WEB_SEARCH_AGENT_ID: ${WEB_SEARCH_AGENT_ID:-bdlh_runtime}
      WEB_SEARCH_TOKEN: ${WEB_SEARCH_AGENT_TOKEN}

  bdlh-runtime-data:
    build:
      context: ../bdlh-runtime-data
      dockerfile: Dockerfile
    container_name: bdlh-runtime-data
    restart: unless-stopped
    network_mode: host
    environment:
      # 云端只需选择prod，全部连接信息都由application-prod.yml提供。
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      JAVA_DATA_INTERNAL_TOKEN: ${JAVA_DATA_INTERNAL_TOKEN}
      JAVA_DATA_REQUIRE_AUTHENTICATED: ${JAVA_DATA_REQUIRE_AUTHENTICATED:-true}
      LEGACY_JAVA_AGENT_RUNTIME_ENABLED: ${LEGACY_JAVA_AGENT_RUNTIME_ENABLED:-false}
      # Backend 只允许同机边缘 Nginx 访问，不直接监听公网网卡。
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8081
