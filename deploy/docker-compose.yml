# ============================================================
# BDLH Agent Runtime 本地/测试部署
# Python Runtime 负责 Agent 编排；Java 负责认证、用户事实与运行数据；
# Web Search Adapter 与 SearXNG 提供受控外部检索。
# 配置：统一使用 deploy/.env（模板见 deploy/.env.example，含中文注释）。
# 使用: docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
# ============================================================

services:
  rmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: bdlh-rmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    expose:
      - "9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: bdlh-rmq-broker
    restart: unless-stopped
    command: sh mqbroker --enable-proxy -c /home/rocketmq/rocketmq-5.3.2/conf/bdlh-broker.conf
    environment:
      NAMESRV_ADDR: rmq-namesrv:9876
    depends_on:
      rmq-namesrv:
        condition: service_healthy
    expose:
      - "8081"
      - "10909"
      - "10911"
      - "10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/bdlh-broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rmq-namesrv:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  rmq-init:
    image: apache/rocketmq:5.3.2
    container_name: bdlh-rmq-init
    restart: "no"
    environment:
      NAMESRV_ADDR: rmq-namesrv:9876
    depends_on:
      rmq-broker:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        sh mqadmin updatetopic -n rmq-namesrv:9876 -c DefaultCluster -t bdlh.notification.commands
        sh mqadmin updatetopic -n rmq-namesrv:9876 -c DefaultCluster -t bdlh.runtime.events
        sh mqadmin updatetopic -n rmq-namesrv:9876 -c DefaultCluster -t bdlh.user.events
        sh mqadmin updatetopic -n rmq-namesrv:9876 -c DefaultCluster -t bdlh.memory.commands
        sh mqadmin updateSubGroup -n rmq-namesrv:9876 -c DefaultCluster -g bdlh-notification-consumer
        sh mqadmin updateSubGroup -n rmq-namesrv:9876 -c DefaultCluster -g bdlh-memory-consumer

  bdlh-runtime-orchestrator:
    build:
      context: ../bdlh-runtime-orchestrator
      dockerfile: Dockerfile
    container_name: bdlh-runtime-orchestrator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # 以下变量统一来自 deploy/.env（模板见 .env.example）
      BDLH_RUNTIME_ENV: ${BDLH_RUNTIME_ENV:-development}
      BDLH_RUNTIME_AUTH_REQUIRED: ${BDLH_RUNTIME_AUTH_REQUIRED:-true}
      BDLH_RUNTIME_API_PREFIX: ${BDLH_RUNTIME_API_PREFIX:-/api/v1}
      BDLH_RUNTIME_MAX_EVENT_WAIT_SECONDS: ${BDLH_RUNTIME_MAX_EVENT_WAIT_SECONDS:-30}
      BDLH_FINANCIAL_TASK_WORKER_ENABLED: ${BDLH_FINANCIAL_TASK_WORKER_ENABLED:-false}
      BDLH_FINANCIAL_TASK_POLL_SECONDS: ${BDLH_FINANCIAL_TASK_POLL_SECONDS:-10}
      JWT_SECRET: ${JWT_SECRET}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      JAVA_API_BASE_URL: ${JAVA_API_BASE_URL:-http://bdlh-runtime-data:8080}
      JAVA_DATA_INTERNAL_TOKEN: ${JAVA_DATA_INTERNAL_TOKEN}
      BDLH_MEMORY_MODE: ${BDLH_MEMORY_MODE:-noop}
      MEMORY_SERVICE_BASE_URL: ${MEMORY_SERVICE_BASE_URL:-http://bdlh-memory-service:8091}
      MEMORY_SERVICE_INTERNAL_TOKEN: ${MEMORY_SERVICE_INTERNAL_TOKEN}
      AKSHARE_ONE_MCP_TRANSPORT: ${AKSHARE_ONE_MCP_TRANSPORT:-streamable_http}
      AKSHARE_ONE_MCP_ENDPOINT: ${AKSHARE_ONE_MCP_ENDPOINT:-http://host.docker.internal:8083/mcp}
      AKSHARE_ONE_MCP_TIMEOUT: ${AKSHARE_ONE_MCP_TIMEOUT:-20}
      CN_FINANCIAL_MCP_TRANSPORT: ${CN_FINANCIAL_MCP_TRANSPORT:-sse}
      CN_FINANCIAL_MCP_ENDPOINT: ${CN_FINANCIAL_MCP_ENDPOINT:-http://host.docker.internal:8000/sse}
      CN_FINANCIAL_MCP_TIMEOUT: ${CN_FINANCIAL_MCP_TIMEOUT:-20}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-http://bdlh-web-search-adapter:3002}
      WEB_SEARCH_AGENT_ID: ${WEB_SEARCH_AGENT_ID:-bdlh_runtime}
      WEB_SEARCH_TOKEN: ${WEB_SEARCH_TOKEN}
      WEB_SEARCH_TIMEOUT: ${WEB_SEARCH_TIMEOUT:-20}
      BDLH_DEEP_RESEARCH_ENABLED: ${BDLH_DEEP_RESEARCH_ENABLED:-false}
      BDLH_BAILIAN_WEB_SEARCH_API_KEY: ${BDLH_BAILIAN_WEB_SEARCH_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BDLH_BAILIAN_WEB_SEARCH_ENDPOINT: ${BDLH_BAILIAN_WEB_SEARCH_ENDPOINT:-}
      BDLH_BAILIAN_WEB_SEARCH_TIMEOUT: ${BDLH_BAILIAN_WEB_SEARCH_TIMEOUT:-20}
      BDLH_BAILIAN_WEB_SEARCH_RATE_LIMIT_PER_MINUTE: ${BDLH_BAILIAN_WEB_SEARCH_RATE_LIMIT_PER_MINUTE:-30}
      REDIS_URL: ${REDIS_URL:-}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-glm-4.7}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-qwen3-embedding:4b-q8_0}
      QWEN3_BASE_URL: ${QWEN3_BASE_URL:-http://host.docker.internal:11434/v1}
      QWEN3_API_KEY: ${QWEN3_API_KEY:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bdlh-runtime-data:
        condition: service_healthy
      bdlh-memory-service:
        condition: service_healthy
      bdlh-web-search-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  bdlh-runtime-data:
    build:
      context: ../bdlh-runtime-data
      dockerfile: Dockerfile
    container_name: bdlh-runtime-data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # 以下变量统一来自 deploy/.env（模板见 .env.example）
      # 容器内必须监听 0.0.0.0:8080（与下方端口映射/健康检查及 JAVA_API_BASE_URL 对齐）；
      # 环境变量优先级高于 jar 内 application-dev.yml 的回环绑定。
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PG_URL: ${PG_URL}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-${PG_URL}}
      BDLH_DB_MIN_IDLE: ${BDLH_DB_MIN_IDLE:-1}
      BDLH_DB_MAX_POOL_SIZE: ${BDLH_DB_MAX_POOL_SIZE:-8}
      BDLH_DB_CONNECTION_TIMEOUT_MS: ${BDLH_DB_CONNECTION_TIMEOUT_MS:-3000}
      BDLH_DB_VALIDATION_TIMEOUT_MS: ${BDLH_DB_VALIDATION_TIMEOUT_MS:-1000}
      BDLH_DB_LEAK_DETECTION_THRESHOLD_MS: ${BDLH_DB_LEAK_DETECTION_THRESHOLD_MS:-0}
      ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-false}
      ROCKETMQ_ENDPOINTS: ${ROCKETMQ_ENDPOINTS:-rmq-broker:8081}
      ROCKETMQ_RELAY_FIXED_DELAY_MS: ${ROCKETMQ_RELAY_FIXED_DELAY_MS:-1000}
      ROCKETMQ_RELAY_BATCH_SIZE: ${ROCKETMQ_RELAY_BATCH_SIZE:-50}
      MYSQL_URL: ${MYSQL_URL}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BDLH_RUNTIME_SINGLE_USER_ID: ${BDLH_RUNTIME_SINGLE_USER_ID:-1}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_DAYS: ${JWT_EXPIRATION_DAYS:-7}
      JAVA_DATA_INTERNAL_TOKEN: ${JAVA_DATA_INTERNAL_TOKEN}
      JAVA_DATA_REQUIRE_AUTHENTICATED: ${JAVA_DATA_REQUIRE_AUTHENTICATED:-true}
    depends_on:
      rmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bdlh-memory-service:
    build:
      context: ../bdlh-memory-service
      dockerfile: Dockerfile
    container_name: bdlh-memory-service
    restart: unless-stopped
    environment:
      BDLH_RUNTIME_ENV: ${BDLH_RUNTIME_ENV:-development}
      MEMORY_SERVICE_INTERNAL_TOKEN: ${MEMORY_SERVICE_INTERNAL_TOKEN}
      MEMORY_POSTGRES_DSN: ${MEMORY_POSTGRES_DSN}
      MEMORY_ROCKETMQ_ENABLED: ${MEMORY_ROCKETMQ_ENABLED:-false}
      ROCKETMQ_ENDPOINTS: ${ROCKETMQ_ENDPOINTS:-rmq-broker:8081}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-glm-4.7}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-qwen3-embedding:4b-q8_0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      QWEN3_API_KEY: ${QWEN3_API_KEY:-}
      QWEN3_BASE_URL: ${QWEN3_BASE_URL:-}
      MEM0_CONFIG_JSON: ${MEM0_CONFIG_JSON:-}
    expose:
      - "8091"
    depends_on:
      rmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bdlh-web-search-adapter:
    build:
      context: ../bdlh-web-search-adapter
      dockerfile: Dockerfile
    container_name: bdlh-web-search-adapter
    restart: unless-stopped
    environment:
      # 以下变量统一来自 deploy/.env（模板见 .env.example）
      PORT: ${PORT:-3002}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARXNG_ENGINES: ${SEARXNG_ENGINES:-baidu,360search}
      WEB_SEARCH_AGENTS_JSON: ${WEB_SEARCH_AGENTS_JSON}
      WEB_SEARCH_TIMEOUT_MS: ${WEB_SEARCH_TIMEOUT_MS:-10000}
      WEB_SEARCH_CACHE_TTL_MS: ${WEB_SEARCH_CACHE_TTL_MS:-60000}
      WEB_SEARCH_RATE_LIMIT_PER_MINUTE: ${WEB_SEARCH_RATE_LIMIT_PER_MINUTE:-60}
      WEB_SEARCH_CIRCUIT_FAILURE_THRESHOLD: ${WEB_SEARCH_CIRCUIT_FAILURE_THRESHOLD:-5}
      WEB_SEARCH_CIRCUIT_RESET_MS: ${WEB_SEARCH_CIRCUIT_RESET_MS:-30000}
      WEB_SEARCH_MAX_BODY_BYTES: ${WEB_SEARCH_MAX_BODY_BYTES:-32768}
      WEB_SEARCH_MAX_TASKS: ${WEB_SEARCH_MAX_TASKS:-3}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
    expose:
      - "3002"
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: bdlh-runtime-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    expose:
      - "8080"
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rocketmq-namesrv-logs:
  rocketmq-store:
  rocketmq-broker-logs:
