name: touchstone

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-touchstone}
      POSTGRES_USER: ${POSTGRES_USER:-touchstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - touchstone-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-touchstone} -d ${POSTGRES_DB:-touchstone}"]
      interval: 5s
      timeout: 3s
      retries: 20

  data:
    build:
      context: ../data
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-touchstone}
      DATABASE_USER: ${POSTGRES_USER:-touchstone}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATA_INTERNAL_TOKEN: ${DATA_INTERNAL_TOKEN:?DATA_INTERNAL_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  engine:
    build:
      context: ../engine
    restart: unless-stopped
    environment:
      DATA_API_BASE_URL: http://data:8080/internal/v1
      DATA_INTERNAL_TOKEN: ${DATA_INTERNAL_TOKEN:?DATA_INTERNAL_TOKEN is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7-flash}
      GIT_COMMIT: ${GIT_COMMIT:-local}
      ARTIFACTS_DIR: /app/artifacts
      MAX_CONCURRENT_BATCHES: ${MAX_CONCURRENT_BATCHES:-1}
      CONTEXT_MEMORY_MODE: ${CONTEXT_MEMORY_MODE:-legacy}
      CONTEXT_BUILD_STORE: ${CONTEXT_BUILD_STORE:-file}
      RUN_API_ALLOWED_ORIGINS: ${RUN_API_ALLOWED_ORIGINS:-}
    depends_on:
      data:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8090}:8090"
    volumes:
      - touchstone-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../web
    restart: unless-stopped
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8082/docs/"]
      interval: 10s
      timeout: 3s
      retries: 8

volumes:
  touchstone-postgres:
  touchstone-artifacts:
