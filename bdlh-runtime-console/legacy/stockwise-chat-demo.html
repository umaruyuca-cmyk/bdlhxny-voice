<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0; url=/agent-chat.html">
  <title>StockWise · Demo 演示</title>
  <style>
    :root{
      --primary:#4d6bfe;--primary-soft:#eef2ff;--primary-hover:#3b5de7;
      --text:#202329;--muted:#69707b;--line:#e5e7eb;--bg:#f7f8fa;--white:#fff;
      --red:#e5484d;--green:#16a36a;--orange:#d97706;
      --shadow:0 4px 16px rgba(31,35,41,.08);--radius:10px;--radius-sm:7px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);overflow:hidden}

    .app{height:100vh;display:flex;flex-direction:column}
    .demo-banner{height:38px;min-height:38px;background:#1a1a2e;color:#c9d2ff;display:flex;align-items:center;justify-content:center;font-size:11px;gap:8px}
    .demo-banner i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

    .topbar{height:56px;min-height:56px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
    .logo{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--primary);color:#fff;font-weight:800;font-size:16px}
    .top-actions{display:flex;align-items:center;gap:10px}
    .session-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:11px;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .ghost{height:32px;padding:0 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--white);color:#4e545d;font-size:12px}.ghost:hover{border-color:#b9bec7}
    .tab-btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--white);color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
    .tab-btn.active{background:var(--primary-soft);border-color:#c9d2ff;color:var(--primary);font-weight:600}
    .tab-btn .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:#fff;font-size:10px;font-weight:600}

    .main{flex:1;display:flex;overflow:hidden}
    .chat-panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--white);border-right:1px solid var(--line)}
    .side-panel{width:380px;min-width:320px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
    .side-panel.hidden{display:none}

    .chat-head{height:52px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .chat-head strong{font-size:14px}.chat-head small{color:var(--muted);font-size:11px;margin-left:8px}
    .status-bar{display:flex;align-items:center;gap:6px;padding:6px 16px;border-bottom:1px solid var(--line);background:#fafbfc;min-height:34px;overflow-x:auto}
    .status-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;white-space:nowrap}
    .status-tag.active{background:var(--primary-soft);color:var(--primary)}.status-tag.done{background:#eaf8f2;color:var(--green)}
    .status-tag i{width:6px;height:6px;border-radius:50%;background:currentColor}.status-tag.active i{animation:pulse 1.2s infinite}

    .messages{flex:1;overflow:auto;padding:18px 16px 12px;scroll-behavior:smooth}
    .msg{display:flex;gap:10px;margin-bottom:16px}.msg.user{justify-content:flex-end}
    .avatar{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700}
    .msg.user .avatar{background:var(--primary);color:#fff}
    .bubble{max-width:85%;padding:10px 13px;border-radius:4px 12px 12px 12px;background:#f4f5f7;color:#343941;word-break:break-word}
    .msg.user .bubble{border-radius:12px 4px 12px 12px;background:var(--primary);color:#fff}
    .bubble p{margin:0}.bubble p+p{margin-top:6px}
    .bubble.streaming{border-left:2px solid var(--primary);padding-left:11px}
    .typing{display:flex;gap:4px;padding:5px 1px}.typing i{width:5px;height:5px;border-radius:50%;background:#9da4af;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

    .action-card{margin-top:8px;padding:11px 13px;border:1px solid #dfe5ff;border-radius:8px;background:#f7f9ff}
    .action-card .ac-title{font-weight:600;font-size:13px;margin-bottom:7px}
    .action-card .ac-text{color:#545d6b;font-size:12px;line-height:1.7;margin-bottom:9px}
    .action-card .ac-btns{display:flex;gap:7px;flex-wrap:wrap}
    .ac-btn{height:30px;padding:0 12px;border:none;border-radius:6px;font-size:12px;cursor:pointer}
    .ac-btn.primary{background:var(--primary);color:#fff}.ac-btn.primary:hover{background:var(--primary-hover)}
    .ac-btn.secondary{background:var(--white);border:1px solid var(--line);color:#525964}.ac-btn.secondary:hover{border-color:#b9bec7}
    .ac-btn.danger{background:#fff;border:1px solid #fdd;color:var(--red)}.ac-btn.danger:hover{background:#fff5f5}

    .knowledge-item{margin-top:6px;padding:9px 11px;border:1px solid #e5e8ef;border-radius:8px;background:#fff;font-size:12px;cursor:pointer}
    .knowledge-item .ki-header{display:flex;justify-content:space-between;margin-bottom:4px}
    .knowledge-item .ki-score{color:var(--primary);font-weight:600;font-size:11px}
    .knowledge-item .ki-meta{color:var(--muted);font-size:10px;margin-top:4px}
    .knowledge-item .ki-text{color:#525964;line-height:1.6}
    .knowledge-item.selected{border-color:var(--primary);background:var(--primary-soft)}
    .knowledge-item .ki-check{display:none}.knowledge-item.selected .ki-check{display:inline}
    .knowledge-item input[type="text"]{width:100%;margin-top:5px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;font-size:12px}

    .composer{margin:10px 14px 14px;padding:9px 11px;border:1px solid #d6d9df;border-radius:12px;background:var(--white);box-shadow:0 5px 20px rgba(31,35,41,.06);display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:end}
    textarea{border:0;outline:0;resize:none;min-height:42px;max-height:120px;padding:4px;color:var(--text);font:inherit}textarea::placeholder{color:#a1a7b0}
    .send{width:36px;height:36px;border:0;border-radius:9px;background:var(--primary);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}.send:disabled{opacity:.45}

    .side-head{height:52px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--white)}
    .side-head strong{font-size:14px}
    .side-tabs{display:flex;gap:0;border-bottom:1px solid var(--line)}
    .side-tab{flex:1;height:36px;border:0;background:transparent;color:var(--muted);font-size:12px;border-bottom:2px solid transparent}.side-tab.active{border-bottom-color:var(--primary);color:var(--primary);font-weight:600}
    .side-content{flex:1;overflow:auto;padding:12px}
    .search-box{display:flex;gap:7px;margin-bottom:12px}
    .search-box input{flex:1;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px}.search-box input:focus{outline:0;border-color:var(--primary)}
    .k-list{display:flex;flex-direction:column;gap:8px}
    .k-card{padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--white);cursor:pointer;transition:box-shadow .15s}.k-card:hover{box-shadow:var(--shadow)}
    .k-card .kc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .k-tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600}
    .k-tag.active{background:#eaf8f2;color:var(--green)}.k-tag.deprecated{background:#f4f4f5;color:#8e8e93}.k-tag.expired{background:#fff4df;color:var(--orange)}.k-tag.conflicted{background:#fde8e8;color:var(--red)}
    .k-card .kc-text{color:#525964;font-size:12px;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
    .k-card .kc-meta{color:var(--muted);font-size:10px;margin-top:6px}
    .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13px}

    .run-list{display:flex;flex-direction:column;gap:6px}
    .run-card{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--white);cursor:pointer}.run-card:hover{box-shadow:var(--shadow)}
    .run-card .rc-head{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px}
    .run-card .rc-intent{font-weight:600}.run-card .rc-status{font-size:10px}
    .run-status{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:600}
    .run-status.completed{background:#eaf8f2;color:var(--green)}.run-status.failed{background:#fde8e8;color:var(--red)}.run-status.running{background:var(--primary-soft);color:var(--primary)}
    .run-card .rc-time{color:var(--muted);font-size:10px}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:grid;place-items:center}
    .modal{width:min(680px,95vw);max-height:85vh;background:var(--white);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.18);display:flex;flex-direction:column}
    .modal-head{height:52px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .modal-body{flex:1;overflow:auto;padding:16px}
    .modal-body .step-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
    .step-item .step-no{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:700}
    .step-item .step-type{font-weight:600;min-width:110px}.step-item .step-summary{color:#525964;flex:1}
    .step-item .step-duration{color:var(--muted);font-size:10px;white-space:nowrap}
    .highlight-tip{display:inline-block;padding:2px 8px;border-radius:999px;background:#fff4df;color:var(--orange);font-size:10px;font-weight:600;margin-left:4px}

    @media(max-width:860px){
      .side-panel{width:100%;min-width:0;position:fixed;inset:0;z-index:50;top:94px;display:none}.side-panel.open{display:flex}
      .chat-panel{border-right:0}.tab-btn.desktop-only{display:none}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="demo-banner">
    <i></i> <b>演示模式</b> — 模拟 Agent 全流程：意图分类 → Skill 执行 → 流式 Token → 暂停点 → 知识候选 → Run 审计
    <button class="ghost" style="height:24px;font-size:10px;background:transparent;border-color:#4a5080;color:#c9d2ff;margin-left:12px" onclick="runScenario(0)">从头播放</button>
    <button class="ghost" style="height:24px;font-size:10px;background:transparent;border-color:#4a5080;color:#c9d2ff" onclick="runScenario(1)">场景2: 未命中→搜索→入库</button>
    <button class="ghost" style="height:24px;font-size:10px;background:transparent;border-color:#4a5080;color:#c9d2ff" onclick="resetAll()">重置</button>
  </div>

  <header class="topbar">
    <div class="brand"><span class="logo">S</span><span>StockWise</span></div>
    <div class="top-actions">
      <button class="tab-btn desktop-only active" id="tabKnowledge">知识库</button>
      <button class="tab-btn desktop-only" id="tabRuns">运行记录</button>
      <span class="session-badge" id="sessionBadge" title="demo-session-1234">demo-session-12…</span>
      <button class="ghost" id="newSession" onclick="resetAll()">重置演示</button>
    </div>
  </header>

  <div class="main">
    <section class="chat-panel" id="chatPanel">
      <header class="chat-head">
        <div><strong>智能对话</strong><small id="headSkill"></small></div>
        <span id="headRunId" style="color:var(--muted);font-size:10px"></span>
      </header>
      <div class="status-bar" id="statusBar"></div>
      <div class="messages" id="messages">
        <div class="empty" style="padding:60px 0">
          <div style="font-size:36px;margin-bottom:12px">&#x1F4AC;</div>
          <div style="font-weight:600;font-size:15px;margin-bottom:6px">点击上方按钮开始演示</div>
          <div style="color:var(--muted)">场景1: RAG 命中流程 ｜ 场景2: 未命中 → 搜索 → 知识入库</div>
          <div style="margin-top:18px">
            <button class="ac-btn primary" style="margin-right:8px" onclick="runScenario(0)">播放场景1</button>
            <button class="ac-btn secondary" onclick="runScenario(1)">播放场景2</button>
          </div>
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="input" rows="2" placeholder="输入投资问题…（演示模式已禁用发送）"></textarea>
        <button class="send" id="sendBtn" disabled aria-label="发送">↑</button>
      </form>
    </section>

    <aside class="side-panel" id="sidePanel">
      <header class="side-head"><strong id="sideTitle">知识库</strong></header>
      <div class="side-tabs">
        <button class="side-tab active" data-view="knowledge">知识库 <span class="highlight-tip">Demo</span></button>
        <button class="side-tab" data-view="runs">运行记录 <span class="highlight-tip">Demo</span></button>
      </div>
      <div class="side-content" id="sideContent">
        <div id="viewKnowledge"></div>
        <div id="viewRuns" style="display:none"></div>
      </div>
    </aside>
  </div>
</div>

<div class="modal-overlay" id="modalRun" style="display:none">
  <div class="modal">
    <div class="modal-head"><strong>Agent 运行详情</strong><button class="ghost" onclick="closeModal()">关闭</button></div>
    <div class="modal-body" id="modalRunBody"></div>
  </div>
</div>

<script>
  const messages=document.getElementById("messages");
  const statusBar=document.getElementById("statusBar");
  const headSkill=document.getElementById("headSkill");
  const headRunId=document.getElementById("headRunId");
  const sidePanel=document.getElementById("sidePanel");
  const composer=document.getElementById("composer");
  const input=document.getElementById("input");
  const sendBtn=document.getElementById("sendBtn");

  function scrollMsgs(){messages.scrollTop=messages.scrollHeight}
  function clearEmpty(){const e=messages.querySelector(".empty");if(e)e.remove()}

  function addUserMsg(text){
    const row=document.createElement("div");row.className="msg user";
    row.innerHTML='<div class="avatar">U</div><div class="bubble"></div>';
    row.querySelector(".bubble").textContent=text;
    messages.appendChild(row);scrollMsgs();
  }

  function createAgentBubble(){
    clearEmpty();
    const row=document.createElement("div");row.className="msg";
    row.innerHTML='<div class="avatar">AI</div><div class="bubble streaming"><div class="typing"><i></i><i></i><i></i></div></div>';
    messages.appendChild(row);scrollMsgs();
    return {row:row,bubble:row.querySelector(".bubble")};
  }

  function setStatus(steps){
    statusBar.innerHTML="";
    const tags=[
      {key:"classifying",label:"意图分类"},
      {key:"skill_executing",label:"Skill 执行"},
      {key:"retrieving",label:"向量检索"},
      {key:"done",label:"完成"}
    ];
    tags.forEach(t=>{
      if(steps.current===t.key){
        statusBar.innerHTML+='<span class="status-tag active"><i></i>'+t.label+'</span>';
      }else if(tags.indexOf(t)<tags.map(x=>x.key).indexOf(steps.current)){
        statusBar.innerHTML+='<span class="status-tag done">✓ '+t.label+'</span>';
      }
    });
    if(steps.skill)headSkill.textContent="· "+steps.skill; else headSkill.textContent="";
  }

  function addActionCard(bubble,title,text,buttons,onResolve){
    const card=document.createElement("div");card.className="action-card";
    card.innerHTML='<div class="ac-title">'+title+'</div><div class="ac-text">'+text+'</div><div class="ac-btns"></div>';
    const btnRow=card.querySelector(".ac-btns");
    buttons.forEach(b=>{
      const btn=document.createElement("button");
      btn.className="ac-btn "+b.cls;btn.textContent=b.label;
      btn.addEventListener("click",()=>{
        if(b.action)b.action();
        if(onResolve)onResolve(b.label);
      });
      btnRow.appendChild(btn);
    });
    bubble.appendChild(card);
  }

  function addGuardrailWarn(bubble,reason){
    const warn=document.createElement("div");
    warn.style.cssText="color:var(--orange);font-size:11px;margin-top:4px";
    warn.textContent="⚠ 输出护栏: "+reason;
    bubble.appendChild(warn);
  }

  function escHtml(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML}

  function showKnowledgePanel(){
    const v=document.getElementById("viewKnowledge");
    v.innerHTML='<div style="display:flex;flex-direction:column;gap:8px">'+
      '<div class="k-card"><div class="kc-head"><span><span class="k-tag active">技术分析</span> <span class="k-tag active">均线</span></span><span class="k-tag active">active</span></div><div class="kc-text">MA20 乖离率计算方式为 (现价-MA20)/MA20×100%，当乖离率低于-10%时追高风险较低，高于+15%时追高风险较高。该指标需结合趋势方向综合判断。</div><div class="kc-meta">来源: resolved | 置信度: 88</div></div>'+
      '<div class="k-card"><div class="kc-head"><span><span class="k-tag active">因子投资</span> <span class="k-tag active">量化策略</span></span><span class="k-tag active">active</span></div><div class="kc-text">因子投资是通过识别股票共同特征来选股的量化投资方法。常见因子包括价值因子、动量因子、质量因子和波动率因子。多因子模型融合多个因子信号构建综合选股策略。</div><div class="kc-meta">来源: resolved | 置信度: 85 | 过期: 2027-07-24</div></div>'+
      '<div class="k-card"><div class="kc-head"><span><span class="k-tag active">ETF</span> <span class="k-tag active">轮动</span></span><span class="k-tag active">active</span></div><div class="kc-text">ETF 多周期动量轮动策略根据不同时间周期（如20日、60日）的动量信号进行资产切换。当短期动量超过长期动量时加仓，反之减仓或切换至货币基金，可有效控制回撤。</div><div class="kc-meta">来源: resolved | 置信度: 92</div></div>'+
      '<div class="k-card"><div class="kc-head"><span><span class="k-tag active">RSI</span></span><span class="k-tag active">active</span></div><div class="kc-text">RSI 相对强弱指标由 Wilder 在1978年提出，取值范围0-100。RSI>70 为超买区，RSI<30 为超卖区。在 A 股市场，RSI 6 周期常用于短线判断，RSI 14 周期用于中线判断。</div><div class="kc-meta">来源: resolved | 置信度: 90</div></div>'+
      '<div class="k-card"><div class="kc-head"><span><span class="k-tag expired">印花税</span></span><span class="k-tag expired">expired</span></div><div class="kc-text">A 股证券交易印花税单向征收 0.1%，由卖方缴纳。该政策自 2023年8月28日起执行，在此前为双边征收。</div><div class="kc-meta">来源: resolved | 过期: 2026-01-15</div></div>'+
      '</div>';
  }

  function showRunsPanel(){
    const v=document.getElementById("viewRuns");
    v.innerHTML='<div class="run-list">'+
      '<div class="run-card" onclick="openRunDetail(\'run-001\')"><div class="rc-head"><span class="rc-intent">stock-deep-analysis</span><span class="run-status completed">completed</span></div><div class="rc-time">2026-07-28 14:32:10 | 工具调用: 3/5</div></div>'+
      '<div class="run-card" onclick="openRunDetail(\'run-002\')"><div class="rc-head"><span class="rc-intent">investment-knowledge-qa</span><span class="run-status completed">completed</span></div><div class="rc-time">2026-07-28 14:28:45 | 工具调用: 2/5</div></div>'+
      '<div class="run-card" onclick="openRunDetail(\'run-003\')"><div class="rc-head"><span class="rc-intent">portfolio-analysis</span><span class="run-status failed">failed</span></div><div class="rc-time">2026-07-28 10:15:33 | 工具调用: 1/3</div></div>'+
      '<div class="run-card" onclick="openRunDetail(\'run-004\')"><div class="rc-head"><span class="rc-intent">general-chat</span><span class="run-status completed">completed</span></div><div class="rc-time">2026-07-27 16:42:01 | 工具调用: 0/0</div></div>'+
      '</div>';
  }

  function openRunDetail(id){
    document.getElementById("modalRun").style.display="grid";
    const body=document.getElementById("modalRunBody");
    if(id==="run-001"){
      body.innerHTML='<div style="margin-bottom:12px"><strong>Run ID:</strong> 019f7a3b-8c42-...'+id+'</div>'+
        '<div style="margin-bottom:12px"><strong>Skill:</strong> stock-deep-analysis v1.0 | <strong>状态:</strong> completed | <strong>工具调用:</strong> 3/5</div>'+
        '<div style="font-weight:600;margin-bottom:8px">执行步骤 (6)</div>'+

  function closeModal(){document.getElementById("modalRun").style.display="none"}

  function switchSideView(view){
    document.querySelectorAll(".side-tab").forEach(t=>t.classList.toggle("active",t.dataset.view===view));
    document.getElementById("viewKnowledge").style.display=view==="knowledge"?"block":"none";
    document.getElementById("viewRuns").style.display=view==="runs"?"block":"none";
    document.getElementById("sideTitle").textContent=view==="knowledge"?"知识库":"运行记录";
  }

  function resetAll(){
    messages.innerHTML='<div class="empty" style="padding:60px 0"><div style="font-size:36px;margin-bottom:12px">&#x1F4AC;</div><div style="font-weight:600;font-size:15px;margin-bottom:6px">点击上方按钮开始演示</div><div style="color:var(--muted)">场景1: RAG 命中流程 ｜ 场景2: 未命中 → 搜索 → 知识入库</div><div style="margin-top:18px"><button class="ac-btn primary" style="margin-right:8px" onclick="runScenario(0)">播放场景1</button><button class="ac-btn secondary" onclick="runScenario(1)">播放场景2</button></div></div>';
    statusBar.innerHTML="";
    headSkill.textContent="";
    headRunId.textContent="";
    sendBtn.disabled=true;
    showKnowledgePanel();
    showRunsPanel();
  }

  // ===== 场景脚本 =====

  function runScenario(n){
    resetAll();
    if(n===0)scenarioRAGHit();
    else scenarioSearchAndIngest();
  }

  // 场景1: 知识库命中 → 流式回答 → 暂停点 → 确认入库
  function scenarioRAGHit(){
    clearEmpty();
    addUserMsg("ETF 动量轮动策略有哪些常见指标？");

    const a1=createAgentBubble();
    headRunId.textContent="Run: 019f7a3b";

    let i=0;
    const tokens=[
      "基于知识库的 3 条检索结果（相似度最高 0.92），为您总结 ETF 动量轮动策略的常见指标：\n\n",
      "**1. 多周期动量比率**\n比较短期（如 20 日）与长期（如 60 日）价格动量，当短期动量 > 长期动量时加仓。较平滑的指数移动平均（EMA）比简单移动平均（SMA）更常用，可减少信号噪声。\n\n",
      "**2. 相对强弱指标（RSI）**\nRSI 6 周期常用于短线判断，RSI 14 周期用于中线。在轮动策略中，通常选取 RSI 处于 40-60 区间的标的，同时配合 RSI 背离来识别趋势衰竭。\n\n",
      "**3. 波动率指标**\nATR（平均真实波幅）和布林带宽用于动态调整仓位——波动率低时提高仓位，波动率高时降低仓位，通过波动率目标（Volatility Targeting）实现风险预算分配。\n\n",
      "**4. MA20 乖离率**\n计算方式为 (现价-MA20)/MA20×100%。当乖离率低于 -10% 时追高风险较低，高于 +15% 时触发追高预警。该指标是 stock-analysis-skill 的关键决策信号之一。\n\n",
      "⚠ 以上结论基于知识库确定性内容。实时行情数据请结合 CLI 分析。投资有风险，不构成买卖建议。"
    ];

    function pushNext(){
      if(i<tokens.length){
        a1.bubble.textContent+=tokens[i];
        scrollMsgs();
        i++;
        setTimeout(pushNext, i===1?600:i===2?800:i===3?600:i===4?500:400);
      }else{
        a1.bubble.classList.remove("streaming");
        if(Math.random()>0.3)addGuardrailWarn(a1.bubble,"检测到\"保证收益\"倾向措辞 (仅演示示例)");
        addActionCard(a1.bubble,"问题是否已解决？","以上回答是否解决了你的问题？回复\"已解决\"或补充说明",[
          {label:"已解决",cls:"primary",action:()=>showCandidates(a1)},
          {label:"未解决，补充说明",cls:"secondary",action:()=>{input.placeholder="请补充说明…";sendBtn.disabled=false}}
        ]);
        setStatus({current:"done",skill:""});
        headRunId.textContent="";
      }
    }

    setStatus({current:"classifying"});
    setTimeout(()=>setStatus({current:"skill_executing",skill:"investment-knowledge-qa"}),400);
    setTimeout(()=>setStatus({current:"retrieving"}),800);
    setTimeout(pushNext,1000);
  }

  // 场景2: 未命中 → 搜索 → 分析 → 入库
  function scenarioSearchAndIngest(){
    clearEmpty();
    addUserMsg("什么是量化交易中的多因子模型？");

    const a2=createAgentBubble();
    headRunId.textContent="Run: b2c3d4e5";

    let j=0;
    const tokens2=[
      "向量知识库检索结果：最高相似度 0.41（未命中，低于阈值 0.55）。",
      "\n\n调用外部搜索获取相关概念…",
      "\n\n基于搜索结果，整理如下：\n\n**多因子模型**是量化选股的核心框架，通过同时使用多个因子（价值、动量、质量、波动率等）对股票进行综合评分与排序。常见的因子模型包括：\n\n",
      "1. **Fama-French 三因子模型**：引入市值因子（SMB）和账面市值比因子（HML），解释力优于传统 CAPM。\n\n",
      "2. **Carhart 四因子模型**：在三因子基础上加入动量因子（MOM），解释了\u201c强者恒强\u201d效应。\n\n",
      "3. **Barra 多因子风险模型**：工业级应用，通常包含 30-50 个因子，用于风险分解和业绩归因。\n\n",
      "在 A 股市场，多因子策略通常需要加入 Beta 和行业因子来控制系统性风险暴露。",
      "\n\n⚠ 以上内容基于本次搜索结果生成，将在确认后入库为正式知识。投资有风险，不构成买卖建议。"
    ];

    function pushNext2(){
      if(j<tokens2.length){
        a2.bubble.textContent+=tokens2[j];scrollMsgs();j++;
        setTimeout(pushNext2, j<=2?500:j<=4?600:400);
      }else{
        a2.bubble.classList.remove("streaming");
        addActionCard(a2.bubble,"问题是否已解决？","以上回答是否解决了你的问题？",[
          {label:"已解决",cls:"primary",action:()=>showCandidatesB(a2)},
          {label:"未解决",cls:"secondary",action:()=>{input.placeholder="请补充说明…";sendBtn.disabled=false}}
        ]);
        setStatus({current:"done",skill:""});
        headRunId.textContent="";
      }
    }

    setStatus({current:"classifying"});
    setTimeout(()=>setStatus({current:"skill_executing",skill:"investment-knowledge-qa"}),400);
    setTimeout(()=>setStatus({current:"retrieving"}),800);
    setTimeout(pushNext2,1200);
  }

  function showCandidates(a1){
    const card=a1.bubble.querySelector(".action-card");if(card)card.remove();
    let html='<div style="font-weight:600;margin-bottom:8px;font-size:13px;margin-top:12px">以下知识将加入知识库（点击选中，双击修改）：</div>';
    const items=[
      {content:"ETF 多周期动量轮动策略根据不同时间周期的动量信号进行资产切换。当短期动量超过长期动量时加仓，反之减仓或切换至货币基金，可有效控制回撤。",tags:["ETF","轮动","动量"],confidence:92},
      {content:"RSI 相对强弱指标由 Wilder 在1978年提出，取值范围0-100。在 ETF 轮动中，RSI 14 周期常用于中线判断，RSI 6 周期用于短线信号，通常选取 RSI 处于 40-60 区间的标的。",tags:["RSI","技术指标"],confidence:85},
      {content:"MA20 乖离率通过 (现价-MA20)/MA20×100% 计算，代表价格偏离 20 日均线的幅度。A 股 ETF 中乖离率>15% 触发追高预警，<-10% 追高风险较低。",tags:["MA20","乖离率","追高"],confidence:88}
    ];
    items.forEach((item,i)=>{
      html+='<div class="knowledge-item" data-kidx="'+i+'" style="cursor:pointer">'+
        '<div class="ki-header"><span class="ki-check">✓</span><span class="ki-score">#'+(i+1)+'</span></div>'+
        '<div class="ki-text">'+escHtml(item.content)+'</div>'+
        '<div class="ki-meta">标签: '+item.tags.map(t=>'<span style="color:var(--primary)">'+escHtml(t)+'</span>').join(", ")+' | 置信度: '+item.confidence+'</div>'+
        '<input type="text" placeholder="修改此条知识…" style="display:none">'+
        '</div>';
    });
    html+='<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">'+
      '<button class="ac-btn primary" onclick="confirmIngest(this)">确认入库 (3 条)</button>'+
      '<button class="ac-btn secondary" onclick="this.closest(\'.action-card, .msg > div:last-child\').remove()">拒绝</button></div>';
    const container=document.createElement("div");
    container.style.marginTop="8px";
    container.innerHTML=html;
    container.querySelectorAll(".knowledge-item").forEach(el=>{
      el.addEventListener("click",function(e){
        if(e.target.tagName==="INPUT")return;
        this.classList.toggle("selected");
      });
      el.addEventListener("dblclick",function(e){
        const inp=this.querySelector("input");
        inp.style.display="block";
        inp.value=this.querySelector(".ki-text").textContent;
        inp.focus();
      });
      const inp=el.querySelector("input");
      inp.addEventListener("blur",function(){
        if(this.value.trim())el.querySelector(".ki-text").textContent=this.value.trim();
        this.style.display="none";
      });
    });
    a1.bubble.appendChild(container);
  }

  function showCandidatesB(a2){
    const card=a2.bubble.querySelector(".action-card");if(card)card.remove();
    let html='<div style="font-weight:600;margin-bottom:8px;font-size:13px;margin-top:12px">以下知识将加入知识库（点击选中，双击修改）：</div>';

      {content:"多因子模型是量化选股的核心框架，通过同时使用多个因子（价值、动量、质量、波动率等）对股票进行综合评分与排序。Fama-French 三因子模型引入市值因子(SMB)和账面市值比因子(HML)。",tags:["多因子","Fama-French","量化"],confidence:82},
      {content:"Carhart 四因子模型在 Fama-French 三因子基础上加入动量因子(MOM)，用于解释股票收益的动量效应。Barra 多因子风险模型是工业级应用，通常包含 30-50 个因子用于风险分解和业绩归因。",tags:["Carhart","Barra","因子模型"],confidence:79}
    ];
    items.forEach((item,i)=>{
      html+='<div class="knowledge-item" data-kidx="'+i+'" style="cursor:pointer">'+
        '<div class="ki-header"><span class="ki-check">✓</span><span class="ki-score">#'+(i+1)+'</span></div>'+
        '<div class="ki-text">'+escHtml(item.content)+'</div>'+
        '<div class="ki-meta">标签: '+item.tags.map(t=>'<span style="color:var(--primary)">'+escHtml(t)+'</span>').join(", ")+' | 置信度: '+item.confidence+'</div>'+
        '<input type="text" placeholder="修改此条知识…" style="display:none">'+
        '</div>';
    });
    html+='<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">'+

      '<button class="ac-btn secondary" onclick="this.closest(\'.action-card, .msg > div:last-child\').remove()">拒绝</button></div>';
    const container=document.createElement("div");
    container.style.marginTop="8px";
    container.innerHTML=html;
    container.querySelectorAll(".knowledge-item").forEach(el=>{
      el.addEventListener("click",function(e){if(e.target.tagName==="INPUT")return;this.classList.toggle("selected")});
      el.addEventListener("dblclick",function(){
        const inp=this.querySelector("input");

      });
      const inp=el.querySelector("input");
      inp.addEventListener("blur",function(){
        if(this.value.trim())el.querySelector(".ki-text").textContent=this.value.trim();
        this.style.display="none";
      });
    });
    a2.bubble.appendChild(container);
  }

  function confirmIngest(btn){
    const container=btn.closest(".msg > div:last-child, .msg .bubble > div:last-child");
    const selected=container?container.querySelectorAll(".knowledge-item.selected").length:0;
    const total=container?container.querySelectorAll(".knowledge-item").length:0;
    const count=selected>0?selected:total;
    const bubble=document.createElement("div");
    bubble.style.cssText="margin-top:8px;padding:9px 13px;border:1px solid #e5e8ef;border-radius:8px;background:#eaf8f2;font-size:12px;color:var(--green)";
    bubble.textContent="✓ 已入库 "+count+" / "+total+" 条知识";
    if(btn.closest(".msg"))btn.closest(".msg").appendChild(bubble);
    else if(btn.parentElement)btn.parentElement.appendChild(bubble);
    btn.parentElement.remove();
  }

  // 初始化
  document.querySelectorAll(".side-tab").forEach(tab=>{
    tab.addEventListener("click",()=>switchSideView(tab.dataset.view));
  });
  document.getElementById("tabKnowledge").addEventListener("click",function(){
    document.getElementById("tabKnowledge").classList.add("active");
    document.getElementById("tabRuns").classList.remove("active");
    switchSideView("knowledge");
  });
  document.getElementById("tabRuns").addEventListener("click",function(){
    document.getElementById("tabRuns").classList.add("active");
    document.getElementById("tabKnowledge").classList.remove("active");
    switchSideView("runs");
  });
  document.getElementById("modalRun").addEventListener("click",function(e){if(e.target===this)closeModal()});
  composer.addEventListener("submit",e=>{e.preventDefault()});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey)e.preventDefault()});

  showKnowledgePanel();
  showRunsPanel();
  switchSideView("knowledge");
</script>
