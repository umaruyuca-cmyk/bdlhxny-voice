<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0; url=/agent-chat.html">
  <meta name="stock-api-base" content="/api">
  <title>Stock Insight Agent · 588200</title>
  <!--
    Java 后端接入约定

    1. 将本文件放入：
       src/main/resources/static/stock-agent.html

    2. 页面默认启用 mockMode。后端接口就绪后，将脚本中的 mockMode 改为 false，
       或在页面加载后调用：
       window.StockAgent.configure({ apiBase: "/api", mockMode: false });

    3. 分析接口：
       POST {apiBase}/stock-agent/analyze
       请求：{"symbol":"588200","timezone":"Asia/Shanghai","forceRefresh":false}
       响应结构参见脚本中的 DEMO_REPORT。

    4. 对话接口：
       POST {apiBase}/stock-agent/chat
       请求：{"conversationId":"...","symbol":"588200","reportVersion":1,"message":"..."}
       推荐返回 Content-Type: text/event-stream，事件格式：
       event: token
       data: {"text":"正在分析……"}

       event: report
       data: {完整 AnalysisReport JSON}

       event: done
       data: {}

    5. 页面只使用 textContent 写入后端内容，不执行后端返回的 HTML 或脚本。
  -->
  <style>
    :root{
      --primary:#4d6bfe;--primary-soft:#eef2ff;--text:#202329;--muted:#69707b;
      --line:#e5e7eb;--bg:#f7f8fa;--white:#fff;--red:#e5484d;--green:#16a36a;
      --orange:#d97706;--shadow:0 10px 28px rgba(31,35,41,.06)
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);overflow:hidden}
    button,textarea{font:inherit}
    button{cursor:pointer}
    .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative;z-index:5}
    .top-left,.top-right,.brand,.symbol-switch,.live{display:flex;align-items:center}
    .top-left,.top-right{gap:13px}.brand{gap:10px;font-weight:700;font-size:18px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:20px}
    .symbol-switch{gap:8px;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;color:var(--muted);font-size:12px}.symbol-switch b{color:var(--text)}
    .live{gap:6px;color:var(--green);font-size:12px}.live i{width:7px;height:7px;border-radius:50%;background:currentColor}
    .ghost{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#4e545d}.ghost:hover{border-color:#b9bec7}.ghost:disabled{cursor:not-allowed;opacity:.45}
    .mobile-tabs{display:none;height:48px;padding:6px;background:#fff;border-bottom:1px solid var(--line);grid-template-columns:1fr 1fr;gap:5px}.mobile-tabs button{border:0;border-radius:7px;background:transparent;color:var(--muted)}.mobile-tabs button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
    .workspace{height:calc(100vh - 60px);display:block}.workspace.report-open{display:grid;grid-template-columns:minmax(360px,40%) minmax(0,60%)}

    .chat-panel{height:100%;min-width:0;background:#fff;display:flex;flex-direction:column}.report-open .chat-panel{border-right:1px solid var(--line)}
    .chat-head{height:64px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .chat-head strong{display:block}.chat-head small{color:var(--muted)}.icon-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted)}
    .welcome{flex:1;display:grid;place-items:center;padding:30px 18px}.welcome-inner{width:min(720px,100%);text-align:center}.welcome-mark{width:46px;height:46px;margin:0 auto 18px;display:grid;place-items:center;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-size:20px;font-weight:800}.welcome h1{margin:0 0 8px;font-size:27px;letter-spacing:-.03em}.welcome>div>p{margin:0 0 24px;color:var(--muted)}
    .start-composer{padding:11px;border:1px solid #d3d7df;border-radius:13px;background:#fff;box-shadow:0 8px 28px rgba(31,35,41,.08);display:grid;grid-template-columns:1fr 38px;gap:8px;align-items:end;text-align:left}.start-composer textarea{min-height:52px}.start-composer .send{width:38px;height:38px}
    .start-prompts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.start-prompts button{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#59616c;text-align:left;font-size:12px}.start-prompts button:hover{border-color:#c9d2ff;background:#fafbff}
    .chat-panel.started .welcome{display:none}.chat-panel:not(.started) .messages,.chat-panel:not(.started) .quick-prompts,.chat-panel:not(.started) .composer{display:none}
    .messages{flex:1;overflow:auto;padding:20px 18px 12px;scroll-behavior:smooth}
    .message{display:flex;gap:9px;margin-bottom:18px}.message.user{justify-content:flex-end}.avatar{width:27px;height:27px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:700}
    .bubble{max-width:88%;padding:10px 12px;border-radius:4px 12px 12px 12px;background:#f4f5f7;color:#343941}.user .bubble{border-radius:12px 4px 12px 12px;background:var(--primary);color:#fff}
    .bubble p{margin:0}.bubble p+p{margin-top:8px}.bubble b{color:#171a1f}.user .bubble b{color:#fff}
    .process{margin:0 0 18px 36px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}
    .process-title{display:flex;justify-content:space-between;margin-bottom:9px;font-weight:600}.process-title span:last-child{color:var(--green);font-size:11px}
    .step{display:flex;align-items:center;gap:8px;padding:4px 0;color:#606873;font-size:12px}.check{width:16px;height:16px;display:grid;place-items:center;border-radius:50%;background:#eaf8f2;color:var(--green);font-size:10px}
    .answer-card{margin-top:10px;padding:11px;border:1px solid #dfe5ff;border-radius:8px;background:#f7f9ff}.answer-card strong{display:block;margin-bottom:5px}.answer-card p{color:#545d6b;font-size:12px;line-height:1.7}
    .actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.mini-btn{height:29px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#525964;font-size:11px}.mini-btn.primary{border-color:#dce3ff;background:var(--primary-soft);color:var(--primary)}
    .typing{display:flex;gap:4px;padding:5px 1px}.typing i{width:5px;height:5px;border-radius:50%;background:#9da4af;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
    .quick-prompts{padding:0 14px 9px;display:flex;gap:6px;overflow:auto}.quick-prompts button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;color:#626a75;padding:5px 9px;font-size:11px}
    .composer{margin:0 14px 14px;padding:9px;border:1px solid #d6d9df;border-radius:11px;background:#fff;box-shadow:0 5px 20px rgba(31,35,41,.06);display:grid;grid-template-columns:1fr 34px;gap:7px;align-items:end}
    textarea{border:0;outline:0;resize:none;min-height:44px;max-height:110px;padding:4px;color:var(--text)}textarea::placeholder{color:#a1a7b0}.send{width:34px;height:34px;border:0;border-radius:8px;background:var(--primary);color:#fff;font-size:16px}.send:disabled{opacity:.45}

    .report-panel{display:none;overflow:auto;background:var(--bg);scroll-behavior:smooth}.report-open .report-panel{display:block}
    .report{max-width:1080px;margin:0 auto;padding:26px 28px 48px}
    .report-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}.report-head h1{font-size:22px;margin:0 0 5px}.report-head p{margin:0;color:var(--muted);font-size:12px}.report-actions{display:flex;align-items:center;gap:8px}.report-state{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;background:#eaf8f2;color:var(--green);font-size:11px}.freshness{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600}.freshness.live{background:#eaf8f2;color:var(--green)}.freshness.delayed{background:#fff4df;color:var(--orange)}.freshness.closed{background:#f4f4f5;color:#8e8e93}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(31,35,41,.02)}
    .summary-box{padding:17px 18px;margin-bottom:13px;border-left:3px solid var(--primary);transition:.35s}.summary-box.flash{box-shadow:0 0 0 4px rgba(77,107,254,.12)}.summary-box h2{font-size:14px;margin:0 0 7px}.summary-box p{margin:0;color:#505762;line-height:1.75}.summary-box b{color:var(--text)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:13px}.kpi{padding:16px 17px;min-height:115px}.kpi+.kpi{border-left:1px solid var(--line)}.kpi span{color:var(--muted);font-size:12px}.kpi strong{display:block;margin:9px 0 3px;font-size:24px}.kpi small{color:#8d949e;font-size:11px}.wait{color:var(--orange)}.safe{color:var(--green)}
    .reasons{display:grid;grid-template-columns:130px repeat(3,1fr);margin-bottom:13px;overflow:hidden}.reason-title,.reason{padding:13px 15px}.reason-title{background:#fafbfc;font-weight:600}.reason{border-left:1px solid var(--line);font-size:12px}.reason b{display:block;margin-bottom:3px}.reason small{color:var(--muted)}
    .report-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.72fr);gap:13px}
    .section-head{height:52px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.section-head h3{font-size:14px;margin:0}.section-head span{color:var(--muted);font-size:11px}
    .chart{padding:12px 14px 6px}.chart svg{display:block;width:100%;height:210px}
    .legend{padding:0 16px 13px;display:flex;gap:15px;color:var(--muted);font-size:11px}.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%}
    .levels{padding:4px 15px 14px}.level{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.level:last-child{border:0}.level span{color:var(--muted);font-size:12px}.level b{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.risk{color:var(--red)}
    .indicators{display:grid;grid-template-columns:repeat(5,1fr);margin-top:13px}.indicator{padding:14px}.indicator+.indicator{border-left:1px solid var(--line)}.indicator span{color:var(--muted);font-size:11px}.indicator b{display:block;margin:7px 0 2px;font-size:16px}.indicator small{color:#9298a1;font-size:10px}
    .ask{border:0;background:transparent;color:var(--primary);font-size:11px;padding:0}
    .footnote{text-align:center;color:#9aa0a9;font-size:11px;margin-top:18px}

    @media(max-width:980px){.workspace.report-open{grid-template-columns:350px minmax(0,1fr)}.report{padding:22px 18px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(4){border-top:1px solid var(--line)}.reasons{grid-template-columns:1fr}.reason{border-left:0;border-top:1px solid var(--line)}.report-grid{grid-template-columns:1fr}.indicators{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){.symbol-switch,.top-right .live{display:none}.mobile-tabs.ready{display:grid}.workspace,.workspace.report-open{height:calc(100vh - 60px);display:block}.mobile-tabs.ready+.workspace{height:calc(100vh - 108px)}.chat-panel,.report-panel{height:100%;border:0!important}.workspace[data-view="chat"] .report-panel,.workspace[data-view="report"] .chat-panel{display:none}.workspace[data-view="report"] .report-panel{display:block}.start-prompts{grid-template-columns:1fr}.report{padding:18px 12px 38px}.report-head h1{font-size:19px}.kpis{grid-template-columns:1fr 1fr}.indicators{grid-template-columns:1fr 1fr}.indicator:nth-child(odd){border-left:0}.indicator{border-bottom:1px solid var(--line)}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <div class="brand"><span class="logo">S</span><span>Stock Insight Agent</span></div>
      <div class="symbol-switch"><span>当前标的</span><b id="topSymbol">未选择标的</b><span>⌄</span></div>
    </div>
    <div class="top-right"><span class="live"><i></i><span id="dataStatus">等待查询</span></span><button class="ghost" id="reanalyze" disabled>重新分析</button><button class="ghost" id="newChat">新建对话</button></div>
  </header>

  <div class="mobile-tabs" id="mobileTabs"><button class="active" data-view="chat">对话</button><button data-view="report">分析报告 ●</button></div>

  <div class="workspace" data-view="chat">
    <section class="chat-panel" id="chatPanel">
      <header class="chat-head"><div><strong>ETF 分析助手</strong><small>基于北京时间与确定性指标</small></div><button class="icon-btn" title="更多">···</button></header>
      <div class="welcome">
        <div class="welcome-inner">
          <div class="welcome-mark">S</div>
          <h1>今天想分析什么？</h1>
          <p>输入股票、ETF 或基金代码，我会先核验最新数据，再给出结构化分析。</p>
          <form class="start-composer" id="startComposer"><textarea id="startInput" rows="2" placeholder="例如：分析一下 588200，现在适合买入吗？"></textarea><button class="send" aria-label="开始发送">↑</button></form>
          <div class="start-prompts">
            <button data-start-prompt="分析一下 588200，现在适合买入吗？">分析 588200<br><small>查看趋势与买入条件</small></button>
            <button data-start-prompt="帮我判断 588200 是否存在追高风险">追高风险判断<br><small>检查价格与均线乖离</small></button>
            <button data-start-prompt="如果我已经持有 588200，应该怎么操作？">持仓分析<br><small>生成仓位与风险计划</small></button>
          </div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="quick-prompts"><button data-prompt="为什么现在不建议买入？">为什么观望？</button><button data-prompt="追高预警是怎么计算的？">追高预警依据</button><button data-prompt="如果跌破风险线怎么办？">风险线处理</button></div>
      <form class="composer" id="composer"><textarea id="input" rows="2" placeholder="继续询问这只 ETF…"></textarea><button class="send" aria-label="发送">↑</button></form>
    </section>

    <section class="report-panel" id="reportPanel"></section>
  </div>

  <template id="reportTemplate">
      <div class="report">
        <header class="report-head"><div><h1 id="reportTitle">588200 · 科创芯片ETF嘉实</h1><p>分析版本 <span id="reportVersion">1</span> · 数据截至 <span id="reportTime">2026-07-24 14:27:10</span> · 北京时间</p></div><div class="report-actions"><span class="freshness delayed" id="freshnessBadge">🕐 最近收盘</span><span class="report-state" id="reportState">✓ 报告已生成</span><button class="ghost" id="closeReport">关闭</button></div></header>

        <article class="card summary-box" id="summaryBox">
          <h2>分析总结</h2>
          <p id="reportSummary"><b>当前处于下跌趋势中的弱势修复阶段。</b>追高风险暂时不高，但技术面尚未形成明确买点。未持有者等待站稳 <b>1.281</b> 并突破 <b>1.292</b>；已持有者小仓观察、暂不补仓。跌破 <b>1.223</b> 后需要重新评估。</p>
        </article>

        <section class="card kpis">
          <div class="kpi"><span>当前结论</span><strong class="wait" id="decisionAction">观望</strong><small id="decisionNote">等待趋势确认</small></div>
          <div class="kpi"><span>追高预警</span><strong class="safe" id="chaseRisk">安全</strong><small id="chaseNote">安全不等于买入信号</small></div>
          <div class="kpi"><span>最新价格</span><strong id="quotePrice">1.266</strong><small id="quoteChange" style="color:var(--red)">+0.014 · +1.12%</small></div>
          <div class="kpi"><span>技术强度</span><strong id="techScore">55 / 100</strong><small id="techStage">弱势修复阶段</small></div>
        </section>

        <section class="card reasons">
          <div class="reason-title">为什么观望？</div>
          <div class="reason"><b id="reasonTitle0">趋势尚未修复</b><small id="reasonText0">价格低于 MA60 与 MA20</small></div>
          <div class="reason"><b id="reasonTitle1">动量仍然偏弱</b><small id="reasonText1">MACD 为空头，RSI 处于弱区</small></div>
          <div class="reason"><b id="reasonTitle2">量能没有确认</b><small id="reasonText2">量比 0.91，暂未放量突破</small></div>
        </section>

        <div class="report-grid">
          <article class="card">
            <div class="section-head"><h3>价格趋势</h3><span>近 20 日</span></div>
            <div class="chart" id="trendChart"></div>
            <div class="legend"><span><i style="background:#4d6bfe"></i>收盘价</span><span><i style="background:#adb4c0"></i>MA20</span><span><i style="background:#d97706"></i>现价</span></div>
          </article>
          <article class="card">
            <div class="section-head"><h3>关键价位</h3><button class="ask" data-prompt="这些关键价位应该怎么使用？">询问 Agent</button></div>
            <div class="levels">
              <div class="level"><span>趋势增强</span><b id="levelStrengthen">1.316</b></div>
              <div class="level"><span>强度确认</span><b id="levelConfirm" style="color:var(--primary)">1.292</b></div>
              <div class="level"><span>第一修复</span><b id="levelRepair">1.281</b></div>
              <div class="level"><span>当前价格</span><b id="levelCurrent">1.266</b></div>
              <div class="level"><span>风险预警</span><b class="risk" id="levelRisk">1.223</b></div>
            </div>
          </article>
        </div>

        <section class="card indicators">
          <div class="indicator"><span>趋势</span><b id="indicatorTrend" style="color:var(--red)">下跌</b><small id="indicatorTrendNote">均线空头</small></div>
          <div class="indicator"><span>MACD</span><b id="indicatorMacd" style="color:var(--red)">空头</b><small id="indicatorMacdNote">柱 -0.0654</small></div>
          <div class="indicator"><span>RSI 6</span><b id="indicatorRsi">40.39</b><small id="indicatorRsiNote">中性偏弱</small></div>
          <div class="indicator"><span>量比</span><b id="indicatorVolume">0.91</b><small id="indicatorVolumeNote">普通量能</small></div>
          <div class="indicator"><span>MA20 乖离</span><b class="wait" id="indicatorBias">-11.16%</b><small id="indicatorBiasNote">追高风险低</small></div>
        </section>
        <div class="footnote">AI 辅助分析，不构成投资建议。事实数据与代码计算结果应优先于模型解释。</div>
      </div>
  </template>

  <script>
    /*
      ==================== Java API 数据模型 ====================
      所有后端数据都通过 renderReport() 写入页面。
      后端不要返回 HTML；解释文字使用纯文本，避免 XSS 与布局失控。
    */
    const DEMO_REPORT={
      traceId:"demo-588200-1",
      version:1,
      symbol:"588200",
      name:"科创芯片ETF嘉实",

      quote:{price:1.266,change:0.014,changePercent:1.12},
      decision:{

        note:"等待趋势确认",

      },
      reasons:[
        {title:"趋势尚未修复",text:"价格低于 MA60 与 MA20"},
        {title:"动量仍然偏弱",text:"MACD 为空头，RSI 处于弱区"},
        {title:"量能没有确认",text:"量比 0.91，暂未放量突破"}
      ],
      levels:{strengthen:1.316,confirm:1.292,repair:1.281,current:1.266,risk:1.223},
      indicators:{
        trend:{value:"下跌",note:"均线空头"},
        macd:{value:"空头",note:"柱 -0.0654"},
        rsi6:{value:40.39,note:"中性偏弱"},
        volumeRatio:{value:0.91,note:"普通量能"},
        ma20Bias:{value:"-11.16%",note:"追高风险低"}
      },
      dataQuality:{status:"delayed", label:"最近收盘 · 非实时"},
      klines:[1.35,1.34,1.33,1.34,1.32,1.31,1.30,1.29,1.28,1.27,1.26,1.25,1.26,1.25,1.24,1.25,1.26,1.25,1.26,1.266],
      ma20line:[null,null,null,null,null,null,null,null,null,null,1.31,1.305,1.30,1.295,1.29,1.288,1.286,1.284,1.282,1.28]
    };

    const state={
      config:{
        apiBase:document.querySelector('meta[name="stock-api-base"]').content.replace(/\/$/,""),
        mockMode:false,
        symbol:"588200",
        timezone:"Asia/Shanghai"
      },
      conversationId:(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():"conversation-"+Date.now(),
      report:DEMO_REPORT,
      reportMounted:false,
      hasAnalyzed:false
    };

    const workspace=document.querySelector(".workspace");
    const chatPanel=document.querySelector("#chatPanel");
    const messages=document.querySelector("#messages");
    const input=document.querySelector("#input");
    const composer=document.querySelector("#composer");
    const startInput=document.querySelector("#startInput");
    const startComposer=document.querySelector("#startComposer");
    const reportPanel=document.querySelector("#reportPanel");
    const reportTemplate=document.querySelector("#reportTemplate");

    function setText(id,value){
      const node=document.getElementById(id);
      if(node&&value!==undefined&&value!==null)node.textContent=String(value);
    }
    function formatPrice(value){
      return Number(value).toFixed(3);
    }
    function formatChange(quote){
      const change=Number(quote.change),percent=Number(quote.changePercent);
      const prefix=change>0?"+":"";
      return `${prefix}${change.toFixed(3)} · ${prefix}${percent.toFixed(2)}%`;
    }
    function flashReport(){
      const box=document.querySelector("#summaryBox");
      if(!box)return;
      box.classList.add("flash");
      setTimeout(()=>box.classList.remove("flash"),1200);
    }
    function drawTrendChart(prices,ma20line,currentPrice){
      const el=document.getElementById("trendChart");
      if(!el||!prices||!prices.length){return;}
      const W=700,H=170,padX=35,padY=18;
      const valid=ma20line?ma20line.filter(v=>v!=null):[];
      const all=prices.concat(valid);
      const min=Math.min.apply(null,all),max=Math.max.apply(null,all),range=(max-min)||1;
      const x=i=>padX+(W-2*padX)*(i/(prices.length-1));
      const y=v=>padY+(H-2*padY)*(1-(v-min)/range);
      const pricePath=prices.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
      let maPath="";
      if(ma20line){ma20line.forEach((v,i)=>{if(v!=null){const cmd=(!i||ma20line[i-1]==null)?"M":"L";maPath+=cmd+x(i).toFixed(1)+" "+y(v).toFixed(1)+" ";}});}
      const curY=y(currentPrice);
      const ticks=["06-27","07-04","07-11","07-18","07-24"];
      el.innerHTML='<svg viewBox="0 0 '+W+' '+(H+28)+'" role="img" aria-label="价格趋势图" style="display:block;width:100%;height:210px">'+
        '<g stroke="#edf0f3"><path d="M'+padX+' '+padY+'H'+(W-padX)+'M'+padX+' '+(padY+(H-2*padY)/4).toFixed(0)+'H'+(W-padX)+'M'+padX+' '+(padY+(H-2*padY)/2).toFixed(0)+'H'+(W-padX)+'M'+padX+' '+(padY+3*(H-2*padY)/4).toFixed(0)+'H'+(W-padX)+'M'+padX+' '+(H-padY)+'H'+(W-padX)+'"/></g>'+
        (maPath?'<path d="'+maPath+'" fill="none" stroke="#adb4c0" stroke-width="1.4" stroke-dasharray="5 4"/>':'')+
        '<path d="'+pricePath+'" fill="none" stroke="#4d6bfe" stroke-width="2.4"/>'+
        '<line x1="'+padX+'" y1="'+curY.toFixed(1)+'" x2="'+(W-padX)+'" y2="'+curY.toFixed(1)+'" stroke="#d97706" stroke-dasharray="4 4"/>'+
        '<rect x="'+(W-padX-48)+'" y="'+(curY-9).toFixed(1)+'" width="46" height="18" rx="4" fill="#fff4df"/>'+
        '<text x="'+(W-padX-25)+'" y="'+(curY+3).toFixed(1)+'" fill="#a85b00" font-size="10" text-anchor="middle">'+Number(currentPrice).toFixed(3)+'</text>'+
        '<g fill="#9aa0a9" font-size="9">'+ticks.map((t,i)=>'<text x="'+padX+i*(W-2*padX)/(ticks.length-1)+'" y="'+(H+12)+'">'+t+'</text>').join("")+'</g>'+
        '</svg>';
    }
    function renderReport(report){
      if(!report||!report.symbol||!report.quote||!report.decision)throw new Error("AnalysisReport 数据不完整");
      state.report=report;
      state.hasAnalyzed=true;
      setText("topSymbol",`${report.symbol} · ${report.shortName||report.name}`);
      setText("dataStatus","数据已核验");
      document.querySelector("#reanalyze").disabled=false;
      if(!state.reportMounted)return report;
      setText("reportTitle",`${report.symbol} · ${report.name}`);
      setText("reportVersion",report.version||1);
      setText("reportTime",report.asOf);
      setText("reportState","✓ 报告已生成");
      const dq=report.dataQuality||{},badge=document.getElementById("freshnessBadge");
      if(badge){const st=dq.status||"delayed";const M={live:["live","🟢","实时盘中"],delayed:["delayed","🕐","最近收盘"],closed:["closed","⛔","休市"]}[st]||["delayed","🕐","最近收盘"];badge.className="freshness "+M[0];badge.textContent=M[1]+" "+(dq.label||M[2]);}
      setText("reportSummary",report.decision.summary);
      setText("decisionAction",report.decision.action);
      setText("decisionNote",report.decision.note);
      setText("chaseRisk",report.decision.chaseRisk);
      setText("chaseNote",report.decision.chaseNote);
      setText("quotePrice",formatPrice(report.quote.price));
      setText("quoteChange",formatChange(report.quote));
      setText("techScore",`${report.decision.techScore} / 100`);
      setText("techStage",report.decision.techStage);

      const levelIds={strengthen:"levelStrengthen",confirm:"levelConfirm",repair:"levelRepair",current:"levelCurrent",risk:"levelRisk"};
      Object.entries(levelIds).forEach(([key,id])=>setText(id,formatPrice(report.levels[key])));
      const indicatorIds={
        trend:["indicatorTrend","indicatorTrendNote"],
        macd:["indicatorMacd","indicatorMacdNote"],
        rsi6:["indicatorRsi","indicatorRsiNote"],
        volumeRatio:["indicatorVolume","indicatorVolumeNote"],
        ma20Bias:["indicatorBias","indicatorBiasNote"]
      };
      Object.entries(indicatorIds).forEach(([key,[valueId,noteId]])=>{
        setText(valueId,report.indicators[key].value);
        setText(noteId,report.indicators[key].note);
      });
      (report.reasons||[]).slice(0,3).forEach((reason,index)=>{
        setText(`reasonTitle${index}`,reason.title);
        setText(`reasonText${index}`,reason.text);
      });
      drawTrendChart(report.klines,report.ma20line,report.quote.price);
      flashReport();
      return report;
    }

    function bindPromptButtons(root=document){
      root.querySelectorAll("[data-prompt]").forEach(button=>{
        if(button.dataset.bound)return;
        button.dataset.bound="true";
        button.addEventListener("click",()=>send(button.dataset.prompt));
      });
    }
    function ensureReportMounted(){
      if(state.reportMounted)return;
      reportPanel.appendChild(reportTemplate.content.cloneNode(true));
      state.reportMounted=true;
      document.querySelector("#mobileTabs").classList.add("ready");
      bindPromptButtons(reportPanel);
      document.querySelector("#closeReport").addEventListener("click",closeReport);
      renderReport(state.report);
    }
    function openReport(){
      ensureReportMounted();
      workspace.classList.add("report-open");
      switchView("report");
      reportPanel.scrollTop=0;
      flashReport();
    }
    function closeReport(){
      workspace.classList.remove("report-open");
      switchView("chat");
    }
    function switchView(view){
      workspace.dataset.view=view;
      document.querySelectorAll(".mobile-tabs [data-view]").forEach(button=>button.classList.toggle("active",button.dataset.view===view));
    }
    function scrollMessages(){
      messages.scrollTop=messages.scrollHeight;
    }
    function addUser(text){
      const row=document.createElement("div");row.className="message user";
      const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;
      row.appendChild(bubble);messages.appendChild(row);scrollMessages();
    }
    function createAgentBubble(){
      const row=document.createElement("div");row.className="message";
      const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent="AI";
      const bubble=document.createElement("div");bubble.className="bubble";
      const typing=document.createElement("div");typing.className="typing";
      typing.innerHTML="<i></i><i></i><i></i>";bubble.appendChild(typing);
      row.append(avatar,bubble);messages.appendChild(row);scrollMessages();
      return bubble;
    }
    function addAgent(text,delay=300){
      const bubble=createAgentBubble();
      setTimeout(()=>{bubble.textContent=text;scrollMessages()},delay);
      return bubble;
    }
    function addProcess(){
      const panel=document.createElement("div");panel.className="process";
      const title=document.createElement("div");title.className="process-title";
      title.innerHTML="<span>分析进度</span><span>已完成</span>";panel.appendChild(title);
      ["北京时间与交易状态已确认","最新行情与日 K 数据已核验","MA、MACD、RSI 与量比已计算","追高预警与关键价位已生成"].forEach(text=>{
        const row=document.createElement("div");row.className="step";
        const check=document.createElement("i");check.className="check";check.textContent="✓";
        row.append(check,document.createTextNode(text));panel.appendChild(row);
      });
      messages.appendChild(panel);scrollMessages();
    }
    function addAnalysisAnswer(){
      const row=document.createElement("div");row.className="message";
      const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent="AI";
      const bubble=document.createElement("div");bubble.className="bubble";
      const title=document.createElement("p");const strong=document.createElement("b");strong.textContent="结论：暂时观望。";title.appendChild(strong);
      const text=document.createElement("p");text.textContent="目前属于下跌趋势中的弱势修复。追高风险不高，但还没有形成明确买点。";
      const answer=document.createElement("div");answer.className="answer-card";
      const answerTitle=document.createElement("strong");answerTitle.textContent="关键判断";
      const answerText=document.createElement("p");answerText.textContent="站稳 1.281 是第一修复，突破 1.292 才算强度确认；跌破 1.223 需要重新评估风险。";
      answer.append(answerTitle,answerText);
      const actions=document.createElement("div");actions.className="actions";
      const reportButton=document.createElement("button");reportButton.className="mini-btn primary";reportButton.textContent="查看完整报告";reportButton.addEventListener("click",openReport);
      const holdButton=document.createElement("button");holdButton.className="mini-btn";holdButton.textContent="持有策略";holdButton.addEventListener("click",()=>send("如果已经持有，应该怎么操作？"));
      actions.append(reportButton,holdButton);bubble.append(title,text,answer,actions);row.append(avatar,bubble);messages.appendChild(row);scrollMessages();
    }
    function startChat(){
      chatPanel.classList.add("started");
    }
    function mockReply(text){
      if(text.includes("持有"))return "如果已经持有，建议保持小仓观察，暂不补仓。1.281 和 1.292 是修复与确认位置；跌破 1.223 且不能快速收回时，应重新评估仓位。";
      if(text.includes("追高"))return "追高预警主要比较当前价格相对 MA20、近期高点与波动区间的位置。当前距 MA20 约 -11.16%，因此没有触发追高，但这不等于已经出现买点。";
      if(text.includes("风险")||text.includes("跌破"))return "1.223 是当前风险预警线。盘中短暂跌破不直接等于卖出信号，应结合收盘能否收回、成交量是否放大以及板块是否同步走弱。";
      if(text.includes("价位"))return "1.281 是第一修复，1.292 是强度确认，1.316 代表趋势进一步增强。未持有者更适合等待确认，而不是仅凭盘中反弹入场。";
      return "结合当前报告，核心判断仍是观望。你可以继续询问追高预警、持有策略、关键价位或风险线。";
    }

    async function analyze(forceRefresh=false){
      setText("dataStatus","正在分析");
      setText("reportState","正在分析…");
      if(state.config.mockMode){
        const report=structuredClone(DEMO_REPORT);
        if(forceRefresh)report.version=(state.report.version||1)+1;
        return renderReport(report);
      }
      const response=await fetch(`${state.config.apiBase}/stock-agent/analyze`,{
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({symbol:state.config.symbol,timezone:state.config.timezone,forceRefresh})
      });
      if(!response.ok)throw new Error(`分析接口失败：HTTP ${response.status}`);
      return renderReport(await response.json());
    }

    function appendReportAction(bubble){
      if(bubble.querySelector(".actions"))return;
      const actions=document.createElement("div");actions.className="actions";
      const button=document.createElement("button");button.className="mini-btn primary";button.textContent="查看完整报告";button.addEventListener("click",openReport);
      actions.appendChild(button);bubble.appendChild(actions);
    }
    function handleSseEvent(eventName,data,bubble){
      if(eventName==="token"){
        const payload=JSON.parse(data);
        if(bubble.querySelector(".typing"))bubble.textContent="";
        bubble.textContent+=payload.text||"";
        scrollMessages();
      }else if(eventName==="report"){
        state.hasAnalyzed=true;
        renderReport(JSON.parse(data));
        appendReportAction(bubble);
      }else if(eventName==="error"){
        const payload=JSON.parse(data);
        bubble.textContent=payload.message||"分析服务暂时不可用";
      }
    }
    async function streamChat(message){
      const bubble=createAgentBubble();
      const response=await fetch(`${state.config.apiBase}/stock-agent/chat`,{
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"text/event-stream, application/json"},
        body:JSON.stringify({
          conversationId:state.conversationId,
          symbol:state.config.symbol,
          reportVersion:state.report.version,
          message
        })
      });
      if(!response.ok)throw new Error(`对话接口失败：HTTP ${response.status}`);
      if(!response.headers.get("content-type")?.includes("text/event-stream")){
        const payload=await response.json();
        bubble.textContent=payload.message||"";
        if(payload.report){
          state.hasAnalyzed=true;
          renderReport(payload.report);
          appendReportAction(bubble);
        }
        return;
      }
      bubble.textContent="";
      const reader=response.body.getReader(),decoder=new TextDecoder();
      let buffer="";
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        buffer+=decoder.decode(value,{stream:true});
        const blocks=buffer.split(/\r?\n\r?\n/);buffer=blocks.pop();
        for(const block of blocks){
          let eventName="message",data="";
          for(const line of block.split(/\r?\n/)){
            if(line.startsWith("event:"))eventName=line.slice(6).trim();
            if(line.startsWith("data:"))data+=line.slice(5).trim();
          }
          if(data)handleSseEvent(eventName,data,bubble);
        }
      }
    }
    async function send(text){
      const value=(text||input.value||startInput.value).trim();if(!value)return;
      startChat();addUser(value);input.value="";startInput.value="";
      try{
        if(!state.hasAnalyzed){
          const symbol=value.match(/(?:^|\D)(\d{6})(?:\D|$)/)?.[1];
          if(!symbol){
            addAgent("请先告诉我具体的股票、ETF 或基金代码，例如：分析 588200。",0);
            return;
          }
          state.config.symbol=symbol;
          if(state.config.mockMode){
            addAgent(`我会先核验 ${symbol} 的最新行情时间，再计算趋势、动量、量能和追高风险。`,0);
            addProcess();
            await analyze(false);
            state.hasAnalyzed=true;
            addAnalysisAnswer();
          }else{
            await streamChat(value);
          }
        }else if(state.config.mockMode){
          addAgent(mockReply(value));
        }else{
          await streamChat(value);
        }
      }catch(error){
        addAgent(`请求失败：${error.message}`,0);
      }
    }

    window.StockAgent={
      configure(options={}){Object.assign(state.config,options);return {...state.config}},
      analyze,
      renderReport,
      sendMessage:send,
      getState(){return structuredClone(state)}
    };

    function resetConversation(){
      closeReport();
      messages.replaceChildren();
      chatPanel.classList.remove("started");
      reportPanel.replaceChildren();
      document.querySelector("#mobileTabs").classList.remove("ready");
      state.reportMounted=false;
      state.hasAnalyzed=false;
      state.report=structuredClone(DEMO_REPORT);
      state.conversationId=(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():"conversation-"+Date.now();
      setText("topSymbol","未选择标的");
      setText("dataStatus","等待查询");
      document.querySelector("#reanalyze").disabled=true;
    }

    document.querySelectorAll(".mobile-tabs [data-view]").forEach(button=>button.addEventListener("click",()=>switchView(button.dataset.view)));
    composer.addEventListener("submit",event=>{event.preventDefault();send()});
    startComposer.addEventListener("submit",event=>{event.preventDefault();send(startInput.value)});
    [input,startInput].forEach(textarea=>textarea.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();send(textarea.value)}}));
    document.querySelectorAll("[data-start-prompt]").forEach(button=>button.addEventListener("click",()=>send(button.dataset.startPrompt)));
    bindPromptButtons(document);
    document.querySelector("#reanalyze").addEventListener("click",async()=>{
      startChat();
      addAgent("正在重新获取北京时间行情并更新技术指标。完成后右侧报告会自动刷新。",0);
      try{await analyze(true)}catch(error){addAgent(`重新分析失败：${error.message}`,0)}
    });
    document.querySelector("#newChat").addEventListener("click",resetConversation);
  </script>
</body>
</html>
