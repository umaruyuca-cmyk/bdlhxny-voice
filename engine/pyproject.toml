[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.1.0"
description = "Touchstone: 基于统一原生 Tool Calling 底座的受控 Agent 实验平台"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.7.0",
  "jsonschema>=4.21.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 测试引导脚本需先改 sys.path 再 import 源码包，E402 是预期形态
"tests/conftest.py" = ["E402"]
"tests/helpers_registry.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
